          if [ "$OBSERVED_SWIFT_HASH" != "${{ needs.nim367-attest-only.outputs.swift_version_hash }}" ] || \
             [ "$OBSERVED_SWIFTC_HASH" != "${{ needs.nim367-attest-only.outputs.swiftc_version_hash }}" ]; then
            echo "::error::this job's Swift/SwiftC tuple does not match the attest-only barrier's observation (J record mismatch)"
