name: iOS Transcript Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/ios/**'
      - 'packages/runtime/**'
      - '.github/workflows/ios-transcript-tests.yml'
  # macOS minutes bill 10x Ubuntu minutes, so on PRs we only run the full
  # simulator job when iOS itself changes. Runtime changes are covered on
  # PRs by the cheap Ubuntu `transcript-bundle` job in ci.yml, and re-run
  # in full here on push to main.
  pull_request:
    branches: [main]
    paths:
      - 'packages/ios/**'
      - '.github/workflows/ios-transcript-tests.yml'
  workflow_dispatch:
    inputs:
      repair_sha:
        description: Exact NIM-367 repair commit; must equal the locked SHA
        required: true
        type: string
      production_stress_iterations:
        description: Seeded production URLSession/WebSocket schedules per test
        required: true
        default: '40'
        type: string
      production_stress_seed:
        description: Unsigned 32-bit decimal seed recorded in receipts
        required: true
        default: '3670421'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Make npm resilient to transient registry socket drops (ECONNRESET) on the
  # cache-miss path. On a cache hit npm ci is skipped entirely (see below).
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_fetch_timeout: '300000'

jobs:
  ios-build-and-test:
    name: iOS Build and Test
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # node_modules cache short-circuits `npm ci` when the lockfile is
      # unchanged, so the common case makes ZERO registry calls and can't hit a
      # transient network failure. Exact-key match only (no restore-keys) so we
      # never run against a partially-stale tree -- on miss we just `npm ci`.
      # Paths are relative to the repo root (github.workspace), NOT the job's
      # packages/ios working-directory, which only applies to `run:` steps.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/extensions/*/node_modules
          key: node-modules-ios-${{ runner.os }}-node22-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          cd ../..
          npm ci --ignore-scripts

      # The editor bundle (vite.config.editor.ts) aliases @nimbalyst/runtime to
      # source, and that source imports @nimbalyst/extension-sdk from its built
      # dist. `npm ci --ignore-scripts` skips that build, so build it explicitly
      # here (as ci.yml does) or the "Build Editor Web Bundle" script phase fails
      # with: Failed to resolve entry for package "@nimbalyst/extension-sdk".
      - name: Build extension-sdk
        run: |
          cd ../..
          npm run build --prefix packages/extension-sdk

      - name: Build transcript bundle
        run: npx vite build --config vite.config.transcript.ts

      - name: Verify transcript bundle exists
        run: |
          if [ ! -f "dist-transcript/transcript.html" ]; then
            echo "Error: transcript.html not found in dist-transcript/"
            exit 1
          fi
          if [ ! -d "dist-transcript/assets" ]; then
            echo "Error: assets folder not found in dist-transcript/"
            exit 1
          fi
          echo "Transcript bundle built successfully"
          du -sh dist-transcript
          du -sh dist-transcript/assets

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Copy transcript to iOS Resources
        run: |
          mkdir -p NimbalystApp/Resources/transcript-dist
          cp dist-transcript/transcript.html NimbalystApp/Resources/transcript-dist/
          cp -R dist-transcript/assets NimbalystApp/Resources/transcript-dist/

      - name: Regenerate Xcode project
        run: |
          cd NimbalystApp
          xcodegen generate

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail

          SIMULATOR_INFO=$(python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "-j", "devicetypes", "runtimes", "devices", "available"],
                  text=True,
              )
          )

          runtimes = [runtime for runtime in data["runtimes"] if runtime.get("isAvailable") and runtime.get("platform") == "iOS"]
          if not runtimes:
              raise SystemExit("No available iOS simulator runtimes found")

          def version_key(runtime):
              return tuple(int(part) for part in runtime["version"].split("."))

          runtimes.sort(key=version_key)
          runtime = runtimes[-1]

          preferred_device_types = [
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro",
          ]

          device_types = {device_type["identifier"]: device_type for device_type in data["devicetypes"]}
          device_type = next((device_types[identifier] for identifier in preferred_device_types if identifier in device_types), None)
          if device_type is None:
              iphone_device_types = sorted(
                  (device_type for device_type in data["devicetypes"] if device_type.get("productFamily") == "iPhone"),
                  key=lambda device_type: device_type["name"],
              )
              if not iphone_device_types:
                  raise SystemExit("No iPhone simulator device types found")
              device_type = iphone_device_types[0]

          existing_devices = data["devices"].get(runtime["identifier"], [])
          existing_device = next(
              (
                  device
                  for device in existing_devices
                  if device.get("isAvailable") and device.get("deviceTypeIdentifier") == device_type["identifier"]
              ),
              None,
          )

          if existing_device is not None:
              simulator_udid = existing_device["udid"]
          else:
              simulator_udid = subprocess.check_output(
                  [
                      "xcrun",
                      "simctl",
                      "create",
                      "CI iPhone Simulator",
                      device_type["identifier"],
                      runtime["identifier"],
                  ],
                  text=True,
              ).strip()

          print(f"SIMULATOR_UDID={simulator_udid}")
          print(f"SIMULATOR_NAME={device_type['name']}")
          print(f"SIMULATOR_RUNTIME={runtime['name']}")
          PY
          )

          echo "$SIMULATOR_INFO" >> "$GITHUB_ENV"

          SIMULATOR_UDID=$(printf '%s\n' "$SIMULATOR_INFO" | sed -n 's/^SIMULATOR_UDID=//p')
          SIMULATOR_NAME=$(printf '%s\n' "$SIMULATOR_INFO" | sed -n 's/^SIMULATOR_NAME=//p')
          SIMULATOR_RUNTIME=$(printf '%s\n' "$SIMULATOR_INFO" | sed -n 's/^SIMULATOR_RUNTIME=//p')

          echo "Using simulator: $SIMULATOR_NAME on $SIMULATOR_RUNTIME ($SIMULATOR_UDID)"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Build NimbalystNative package
        run: |
          cd NimbalystNative
          xcodebuild build \
            -scheme NimbalystNative \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            -skipPackagePluginValidation

      - name: Run NimbalystNative tests
        run: |
          cd NimbalystNative
          xcodebuild test \
            -scheme NimbalystNative \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            -skipPackagePluginValidation \
            -enableCodeCoverage YES

      - name: Build iOS app (simulator)
        run: |
          cd NimbalystApp
          xcodebuild \
            -project NimbalystApp.xcodeproj \
            -scheme NimbalystApp \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            -configuration Debug \
            clean build

      - name: Verify transcript bundle in app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NimbalystApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built app"
            exit 1
          fi

          if [ ! -d "$APP_PATH/transcript-dist" ]; then
            echo "Error: transcript-dist not found in app bundle at $APP_PATH"
            echo "Contents of app bundle:"
            ls -la "$APP_PATH"
            exit 1
          fi

          echo "Transcript bundle successfully included in app"
          ls -la "$APP_PATH/transcript-dist"

  # ---------------------------------------------------------------------
  # NIM-367 manual acceptance gate. Every job below runs only on an explicit
  # workflow_dispatch and reads its OWNER-FILLED IMMUTABLE identity values
  # (approved gate ref/commit/tree/blobs, approved scheme, approved Xcode
  # build, TSan fallback mode/allowlist) from the `nim367-apple-gate-approval`
  # protected GitHub Environment. Those values are populated by a separate
  # owner-authority Phase D record, never by this workflow file itself -- see
  # D:/!! CLAUDE/_pending/v12_nim367_apple_ci_gate_implementation_brief.md,
  # "Independent gate-revision trust anchor".
  #
  # Action pins below are resolved, verifiable upstream commit SHAs (recorded
  # with source in
  # D:/!! CLAUDE/_pending/v12_nim367_canonical_successor_owner_completion_20260723.md),
  # not placeholders -- this closes the action-pin gap flagged by
  # v12_nim367_canonical_successor_owner_brief_20260723.md. They still require
  # separate Phase D re-approval before any real dispatch, per "Immutable
  # action supply-chain lock" in the normative Apple contract.
  #
  # `nim367-attest-only` (below) implements the credit-contract's H0/H1/J
  # attest-only barrier structurally: it runs first, performs no checkout of
  # candidate or SUT, and publishes host/tool/runner observations as job
  # outputs. Every candidate job re-observes the same tuple on its own runner
  # and fails closed on any mismatch before its own checkout step -- this is
  # the mechanically checkable part of the "J" per-job attestation. The
  # cryptographically signed H0 pre-dispatch envelope and H1 post-attestation
  # lease described in
  # D:/!! CLAUDE/_pending/v12_nim367_hosted_macos_credit_contract_revision_20260722.md
  # remain external owner-authority records this workflow file cannot create;
  # candidate jobs' `environment: nim367-apple-gate-approval` protection rule
  # (required reviewers) is the GitHub-native approximation of the H1 barrier
  # until that owner record exists.
  #
  # This job set intentionally does not claim GATE_EVIDENCE_PASS,
  # APPLE_VERIFICATION_PASS, or APPLE_ACCEPTED anywhere -- those verdicts
  # require real Apple runtime evidence that only exists after an authorized
  # dispatch executes these steps on real hosted-macOS hardware.

  nim367-attest-only:
    name: 'NIM-367 Gate 0: attest-only barrier (no candidate/SUT checkout)'
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    permissions:
      contents: read
      actions: read
    outputs:
      xcode_build: ${{ steps.attest.outputs.xcode_build }}
      swift_version_hash: ${{ steps.attest.outputs.swift_version_hash }}
      swiftc_version_hash: ${{ steps.attest.outputs.swiftc_version_hash }}
      runner_os: ${{ steps.attest.outputs.runner_os }}
      attestation_manifest_sha256: ${{ steps.attest.outputs.attestation_manifest_sha256 }}
      complete_tuple_sha256: ${{ steps.attest.outputs.complete_tuple_sha256 }}
      shared_state_manifest_sha256: ${{ steps.attest.outputs.shared_state_manifest_sha256 }}
      attest_job_id: ${{ steps.self-lookup.outputs.attest_job_id }}
    steps:
      - name: Attest-only host/tool/server observation (no checkout)
        id: attest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nim367-attest"

          SW_VERS=$(sw_vers)
          UNAME_A=$(uname -a)
          XCODE_SELECT_P=$(xcode-select -p)
          XCODEBUILD_VERSION=$(xcodebuild -version)
          XCODEBUILD_HELP_HASH=$(xcodebuild -help 2>&1 | shasum -a 256 | cut -d' ' -f1)
          SWIFT_EXEC=$(xcrun --find swift)
          SWIFTC_EXEC=$(xcrun --find swiftc)
          SWIFT_VERSION_OUT=$("$SWIFT_EXEC" --version)
          SWIFTC_VERSION_OUT=$("$SWIFTC_EXEC" --version)
          SWIFT_VERSION_HASH=$(echo "$SWIFT_VERSION_OUT" | shasum -a 256 | cut -d' ' -f1)
          SWIFTC_VERSION_HASH=$(echo "$SWIFTC_VERSION_OUT" | shasum -a 256 | cut -d' ' -f1)
          SWIFT_PACKAGE_HELP_HASH=$("$SWIFT_EXEC" package --help 2>&1 | shasum -a 256 | cut -d' ' -f1)
          SWIFT_TEST_HELP_HASH=$("$SWIFT_EXEC" test --help 2>&1 | shasum -a 256 | cut -d' ' -f1)
          SW_VERS_HASH=$(echo "$SW_VERS" | shasum -a 256 | cut -d' ' -f1)

          # Read-only, credential-safe enumeration of the known SwiftPM/Xcode
          # shared-state roots this contract cares about. A root that does not
          # exist is recorded as "absent" rather than skipped, per the
          # normative brief's "approved state of absent or a canonical
          # path/type/size/content-hash manifest" rule. Only path/type/size
          # are recorded -- no file content is read or printed.
          python3 - > "$RUNNER_TEMP/nim367-attest/shared-state-manifest.json" <<'PYEOF'
          import hashlib, json, os

          roots = [
              os.path.expanduser("~/Library/Caches/org.swift.swiftpm"),
              os.path.expanduser("~/Library/org.swift.swiftpm"),
              os.path.expanduser("~/.swiftpm"),
              os.path.expanduser("~/Library/Developer/Xcode/DerivedData"),
          ]
          manifest = []
          for root in sorted(roots):
              if not os.path.exists(root):
                  manifest.append({"root": root, "state": "absent"})
                  continue
              entries = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames.sort()
                  for name in sorted(filenames):
                      full = os.path.join(dirpath, name)
                      try:
                          size = os.path.getsize(full)
                      except OSError:
                          size = -1
                      entries.append({"path": os.path.relpath(full, root), "size": size})
              manifest.append({"root": root, "state": "present", "entryCount": len(entries), "entries": entries})
          print(json.dumps(manifest, sort_keys=True))
          PYEOF
          SHARED_STATE_MANIFEST_HASH=$(shasum -a 256 "$RUNNER_TEMP/nim367-attest/shared-state-manifest.json" | cut -d' ' -f1)

          cat > "$RUNNER_TEMP/nim367-attest/attestation.json" <<EOF
          {
            "schema": "nim367.attest-only.v2",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "repository": "${{ github.repository }}",
            "workflowRef": "${{ github.workflow_ref }}",
            "workflowSha": "${{ github.workflow_sha }}",
            "headRef": "${{ github.ref }}",
            "headSha": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "runnerOs": "${{ runner.os }}",
            "runnerArch": "${{ runner.arch }}",
            "runnerName": "${{ runner.name }}",
            "xcodeSelectP": $(echo "$XCODE_SELECT_P" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
            "xcodebuildVersion": $(echo "$XCODEBUILD_VERSION" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
            "xcodebuildHelpHash": "$XCODEBUILD_HELP_HASH",
            "swiftExecRealpath": "$SWIFT_EXEC",
            "swiftcExecRealpath": "$SWIFTC_EXEC",
            "swiftVersionHash": "$SWIFT_VERSION_HASH",
            "swiftcVersionHash": "$SWIFTC_VERSION_HASH",
            "swiftPackageHelpHash": "$SWIFT_PACKAGE_HELP_HASH",
            "swiftTestHelpHash": "$SWIFT_TEST_HELP_HASH",
            "swVersHash": "$SW_VERS_HASH",
            "sharedStateManifestSha256": "$SHARED_STATE_MANIFEST_HASH"
          }
          EOF

          MANIFEST_HASH=$(shasum -a 256 "$RUNNER_TEMP/nim367-attest/attestation.json" | cut -d' ' -f1)
          XCODE_BUILD=$(echo "$XCODEBUILD_VERSION" | grep -o 'Build version [A-Za-z0-9]*' | sed 's/Build version //')

          # The "complete observed tuple" the H1/J contract requires is this
          # attestation record's own hash: it already contains every field
          # (image/macOS/Xcode/Swift/SwiftC/help/shared-state) the contract
          # names, so hashing it once yields a single byte-for-byte-comparable
          # value rather than requiring N separate field comparisons.
          COMPLETE_TUPLE_HASH="$MANIFEST_HASH"

          echo "xcode_build=$XCODE_BUILD" >> "$GITHUB_OUTPUT"
          echo "swift_version_hash=$SWIFT_VERSION_HASH" >> "$GITHUB_OUTPUT"
          echo "swiftc_version_hash=$SWIFTC_VERSION_HASH" >> "$GITHUB_OUTPUT"
          echo "runner_os=${{ runner.os }}" >> "$GITHUB_OUTPUT"
          echo "attestation_manifest_sha256=$MANIFEST_HASH" >> "$GITHUB_OUTPUT"
          echo "complete_tuple_sha256=$COMPLETE_TUPLE_HASH" >> "$GITHUB_OUTPUT"
          echo "shared_state_manifest_sha256=$SHARED_STATE_MANIFEST_HASH" >> "$GITHUB_OUTPUT"

          echo "::notice::This job performed no candidate or SUT checkout. Observed only pre-installed host/tool state. Full H0/H1 signed-record verification remains external owner authority (see v12_nim367_hosted_macos_credit_contract_revision_20260722.md)."

      - name: Independently look up this job's own server-assigned ID (paginated, exactly-one-match)
        id: self-lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nim367-attest"
          JOBS_ALL="$RUNNER_TEMP/nim367-attest/jobs-all.json"
          echo "[]" > "$JOBS_ALL"
          NEXT_URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"
          PAGE=1
          while [ -n "$NEXT_URL" ]; do
            HEADERS_FILE="$RUNNER_TEMP/nim367-attest/jobs-headers-$PAGE.txt"
            BODY_FILE="$RUNNER_TEMP/nim367-attest/jobs-body-$PAGE.json"
            curl -sf -D "$HEADERS_FILE" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$NEXT_URL" -o "$BODY_FILE"
            python3 - "$JOBS_ALL" "$BODY_FILE" <<'PYEOF'
          import json, sys
          all_path, body_path = sys.argv[1], sys.argv[2]
          with open(all_path) as f:
              all_jobs = json.load(f)
          with open(body_path) as f:
              body = json.load(f)
          all_jobs.extend(body.get("jobs", []))
          with open(all_path, "w") as f:
              json.dump(all_jobs, f)
          PYEOF
            NEXT_URL=$(grep -i '^link:' "$HEADERS_FILE" | grep -o '<[^>]*>; rel="next"' | sed -E 's/<(.*)>.*/\1/' || true)
            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 20 ]; then
              echo "::error::attest-only: pagination exceeded 20 pages, aborting to avoid unbounded loop"
              exit 1
            fi
          done

          MATCH_RESULT=$(python3 - "$JOBS_ALL" <<'PYEOF'
          import json, os, sys
          with open(sys.argv[1]) as f:
              jobs = json.load(f)
          runner_name = os.environ.get("RUNNER_NAME", "")
          matches = [j for j in jobs if j.get("runner_name") == runner_name]
          if len(matches) == 0:
              print("NO_MATCH")
          elif len(matches) > 1:
              print("AMBIGUOUS_MATCH")
          else:
              print(json.dumps({"id": matches[0].get("id"), "status": matches[0].get("status")}))
          PYEOF
          )

          if [ "$MATCH_RESULT" = "NO_MATCH" ] || [ "$MATCH_RESULT" = "AMBIGUOUS_MATCH" ]; then
            echo "::error::attest-only: self job-ID lookup failed ($MATCH_RESULT) after complete pagination -- provider_not_exposed or ambiguous, failing closed rather than guessing"
            exit 1
          fi

          ATTEST_JOB_ID=$(echo "$MATCH_RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "attest_job_id=$ATTEST_JOB_ID" >> "$GITHUB_OUTPUT"
          echo "attest-only self job-ID lookup: OK ($ATTEST_JOB_ID)"

      - name: Upload attest-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed release: v4
        with:
          name: nim367-attest-only-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nim367-attest
          overwrite: false
          retention-days: 90

  # `nim367-h1-verify` is the fail-closed H1 barrier the credit contract
  # requires (v12_nim367_hosted_macos_credit_contract_revision_20260722.md,
  # "H1 -- post-dispatch credit-execution lease"), rebuilt to the CLOSED
  # SCHEMA required by v12_nim367_h1_j_closed_schema_repair_brief_20260723.md:
  # every downstream approved-* value used by later jobs is sourced from the
  # verified `nim367.h1.v2` record's own fields (below), never from a
  # separately mutable `vars.APPROVED_*` variable living alongside it. Only
  # the H1 record/signature/public-key CARRIER vars remain `vars.*`, since
  # they are exactly what the signature check verifies; everything the
  # signature protects is read out of the verified JSON payload, not a
  # sibling variable an editor could change without forging a signature.
  #
  # Honest limit this cannot close: the public key itself
  # (H1_PUBLIC_KEY_PEM) is still a GitHub Environment variable. Anyone with
  # write access to that protected environment could substitute both a new
  # key and a self-signed record. This verification proves internal
  # consistency (the record matches its signature, and every bound field
  # matches this exact run) -- it is defense-in-depth on top of, not a
  # replacement for, who can write to the protected environment. That
  # boundary cannot be closed by workflow code; only by how tightly the
  # environment's write access and required reviewers are configured, which
  # is outside this repository.
  nim367-h1-verify:
    name: 'NIM-367 Gate 0.5: H1 post-attestation lease verification (closed schema)'
    if: github.event_name == 'workflow_dispatch'
    needs: nim367-attest-only
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    permissions:
      contents: read
      actions: read
    outputs:
      h1_verified: ${{ steps.finalize.outputs.h1_verified }}
      h1_record_sha256: ${{ steps.fetch-verify-sig.outputs.h1_record_sha256 }}
      approved_xcode_build: ${{ steps.finalize.outputs.approved_xcode_build }}
      approved_runner_image_os: ${{ steps.finalize.outputs.approved_runner_image_os }}
      approved_complete_tuple_sha256: ${{ steps.finalize.outputs.approved_complete_tuple_sha256 }}
      approved_shared_state_manifest_sha256: ${{ steps.finalize.outputs.approved_shared_state_manifest_sha256 }}
      approved_gate_ref: ${{ steps.finalize.outputs.approved_gate_ref }}
      approved_workflow_ref: ${{ steps.finalize.outputs.approved_workflow_ref }}
      approved_gate_commit: ${{ steps.finalize.outputs.approved_gate_commit }}
      approved_gate_tree: ${{ steps.finalize.outputs.approved_gate_tree }}
      approved_gate_scheme: ${{ steps.finalize.outputs.approved_gate_scheme }}
      approved_command_plan_hash: ${{ steps.finalize.outputs.approved_command_plan_hash }}
      approved_locked_blobs_json: ${{ steps.finalize.outputs.approved_locked_blobs_json }}
    steps:
      - name: Fetch H1 record and verify signature (fail closed if absent)
        id: fetch-verify-sig
        env:
          H1_RECORD_JSON: ${{ vars.H1_RECORD_JSON }}
          H1_SIGNATURE_BASE64: ${{ vars.H1_SIGNATURE_BASE64 }}
          H1_PUBLIC_KEY_PEM: ${{ vars.H1_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nim367-h1"
          if [ -z "$H1_RECORD_JSON" ] || [ -z "$H1_SIGNATURE_BASE64" ] || [ -z "$H1_PUBLIC_KEY_PEM" ]; then
            echo "::error::protected environment nim367-apple-gate-approval is missing H1_RECORD_JSON/H1_SIGNATURE_BASE64/H1_PUBLIC_KEY_PEM; no owner has signed a post-attestation lease for this run yet -- fail-closed, not an approximation"
            exit 1
          fi
          printf '%s' "$H1_RECORD_JSON" > "$RUNNER_TEMP/nim367-h1/h1-record.json"
          printf '%s' "$H1_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/nim367-h1/h1-pubkey.pem"
          printf '%s' "$H1_SIGNATURE_BASE64" | base64 -d > "$RUNNER_TEMP/nim367-h1/h1-signature.bin"

          # Real cryptographic verification against an owner-published public
          # key using openssl, which is preinstalled on macos-15 runners --
          # no additional dependency is fetched to do this.
          if ! openssl dgst -sha256 -verify "$RUNNER_TEMP/nim367-h1/h1-pubkey.pem" \
                -signature "$RUNNER_TEMP/nim367-h1/h1-signature.bin" \
                "$RUNNER_TEMP/nim367-h1/h1-record.json"; then
            echo "::error::H1 record signature verification failed against the owner-published public key"
            exit 1
          fi

          # Bind the record to describe the SAME key that signed it (blocks a
          # key-substitution confusion where the record and the verifying key
          # were swapped independently without re-signing consistently).
          PUBKEY_FINGERPRINT=$(shasum -a 256 "$RUNNER_TEMP/nim367-h1/h1-pubkey.pem" | cut -d' ' -f1)
          RECORD_FINGERPRINT=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/nim367-h1/h1-record.json')).get('trustAnchorFingerprint',''))")
          if [ "$PUBKEY_FINGERPRINT" != "$RECORD_FINGERPRINT" ]; then
            echo "::error::H1 record's trustAnchorFingerprint does not equal sha256(H1_PUBLIC_KEY_PEM) -- record does not describe the key that signed it"
            exit 1
          fi

          H1_RECORD_SHA256=$(shasum -a 256 "$RUNNER_TEMP/nim367-h1/h1-record.json" | cut -d' ' -f1)
          echo "h1_record_sha256=$H1_RECORD_SHA256" >> "$GITHUB_OUTPUT"
          echo "H1 signature + trust-anchor verification: OK ($H1_RECORD_SHA256)"

      - name: Verify every required closed-schema H1 field is present and bound to this exact run
        env:
          EXPECTED_H0_SHA256: ${{ vars.H0_RECORD_SHA256 }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_ATTEST_MANIFEST_SHA256: ${{ needs.nim367-attest-only.outputs.attestation_manifest_sha256 }}
          EXPECTED_ATTEST_JOB_ID: ${{ needs.nim367-attest-only.outputs.attest_job_id }}
          EXPECTED_COMPLETE_TUPLE_SHA256: ${{ needs.nim367-attest-only.outputs.complete_tuple_sha256 }}
          EXPECTED_SHARED_STATE_MANIFEST_SHA256: ${{ needs.nim367-attest-only.outputs.shared_state_manifest_sha256 }}
        run: |
          set -euo pipefail
          # H0_RECORD_SHA256 is intentionally still a standalone var, not a
          # closed-schema field read out of H1 itself: H0 is a separate,
          # PRIOR immutable record that exists (and is hashed/published)
          # before H1 is ever signed. H1's own `h0RecordSha256` field must
          # match this independently published anchor -- if both lived only
          # inside the same H1 blob, H1 could claim to bind any H0 hash it
          # likes without that hash corresponding to a real, separately
          # published H0 record.
          if [ -z "$EXPECTED_H0_SHA256" ]; then
            echo "::error::H0_RECORD_SHA256 is not published in the protected environment; H1 cannot bind an H0 that does not independently exist -- BLOCKED_ATTESTATION"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/nim367-h1/h1-record.json" <<'PYEOF'
          import datetime, json, os, sys

          with open(sys.argv[1]) as f:
              record = json.load(f)

          if record.get("schema") != "nim367.h1.v2":
              print("::error::H1 record schema is not nim367.h1.v2 -- closed schema required")
              sys.exit(1)

          # Every field the closed schema requires. No defaults: absence of
          # any one of these is BLOCKED_ATTESTATION, not a warning, per
          # v12_nim367_h1_j_closed_schema_repair_brief_20260723.md.
          required_fields = [
              "trustAnchorFingerprint", "h0RecordSha256", "serverAcknowledgmentHash",
              "serverQueryHash", "runId", "runAttempt", "attestJobId", "attestationHash",
              "workflowRef", "headSha", "candidateCommit", "candidateTree", "lockedBlobs",
              "sutCommit", "sutParent", "sutTree", "commandPlanHash", "actor", "reviewer",
              "notBeforeUtc", "expiresUtc", "maxLeaseMinutes", "resultDestination",
              "approvedXcodeBuild", "approvedRunnerImageOS", "approvedCompleteTupleSha256",
              "approvedSharedStateManifestSha256", "approvedGateRef", "approvedGateCommit",
              "approvedGateTree", "approvedGateScheme",
          ]
          missing = [field for field in required_fields if not record.get(field)]
          if missing:
              print(f"::error::H1 record is missing required closed-schema fields: {', '.join(missing)} -- BLOCKED_ATTESTATION")
              sys.exit(1)

          locked_blobs = record.get("lockedBlobs")
          expected_paths = {
              ".github/workflows/ios-transcript-tests.yml",
              "packages/ios/NimbalystAppleGate/Package.swift",
              "packages/ios/NimbalystAppleGate/Package.resolved",
              "packages/ios/NimbalystAppleGate/Tests/NIM367URLSessionStressTests.swift",
          }
          if not isinstance(locked_blobs, dict) or set(locked_blobs.keys()) != expected_paths or not all(locked_blobs.values()):
              print("::error::H1 record's lockedBlobs does not exactly cover the four locked paths with non-empty blob values -- BLOCKED_ATTESTATION")
              sys.exit(1)

          errors = []
          if record.get("h0RecordSha256") != os.environ["EXPECTED_H0_SHA256"]:
              errors.append("h0RecordSha256 does not equal the independently published H0_RECORD_SHA256 anchor")
          if str(record.get("runId")) != os.environ["EXPECTED_RUN_ID"]:
              errors.append("runId mismatch")
          if str(record.get("runAttempt")) != os.environ["EXPECTED_RUN_ATTEMPT"]:
              errors.append("runAttempt mismatch")
          if record.get("headSha") != os.environ["EXPECTED_HEAD_SHA"]:
              errors.append("headSha mismatch")
          if record.get("candidateCommit") != os.environ["EXPECTED_HEAD_SHA"]:
              errors.append("candidateCommit does not equal this run's head SHA")
          if record.get("workflowRef") != os.environ["EXPECTED_WORKFLOW_REF"]:
              errors.append("workflowRef mismatch")
          if record.get("attestationHash") != os.environ["EXPECTED_ATTEST_MANIFEST_SHA256"]:
              errors.append("attestationHash mismatch -- H1 does not bind this run's actual attest-only artifact")
          if str(record.get("attestJobId")) != str(os.environ["EXPECTED_ATTEST_JOB_ID"]):
              errors.append("attestJobId mismatch -- H1 does not bind this run's actual attest-only server job")
          if record.get("approvedCompleteTupleSha256") != os.environ["EXPECTED_COMPLETE_TUPLE_SHA256"]:
              errors.append("approvedCompleteTupleSha256 does not equal the toolchain/image tuple actually observed by attest-only this run")
          if record.get("approvedSharedStateManifestSha256") != os.environ["EXPECTED_SHARED_STATE_MANIFEST_SHA256"]:
              errors.append("approvedSharedStateManifestSha256 does not equal the shared-state manifest actually observed by attest-only this run")
          if record.get("sutCommit") != "cd87e6047b30da9e166d9b2350726ad1d8554009":
              errors.append("sutCommit does not equal the locked repair identity")
          if record.get("sutParent") != "7ec725a456c230751c70a3d7269fc89fd6ce55ca":
              errors.append("sutParent does not equal the locked repair identity")
          if record.get("sutTree") != "f9767e7febafee27347b55ab9a6eee6595d4dbe4":
              errors.append("sutTree does not equal the locked repair identity")

          not_before = record.get("notBeforeUtc")
          expires = record.get("expiresUtc")
          try:
              not_before_dt = datetime.datetime.fromisoformat(not_before.replace("Z", "+00:00"))
              expires_dt = datetime.datetime.fromisoformat(expires.replace("Z", "+00:00"))
          except (ValueError, AttributeError):
              errors.append("notBeforeUtc/expiresUtc are not valid ISO-8601 timestamps")
          else:
              now = datetime.datetime.now(datetime.timezone.utc)
              if now < not_before_dt:
                  errors.append(f"H1 record not yet valid (notBeforeUtc={not_before})")
              if now >= expires_dt:
                  errors.append(f"H1 record expired at {expires}")
              max_lease = record.get("maxLeaseMinutes")
              if not isinstance(max_lease, (int, float)) or (expires_dt - not_before_dt).total_seconds() > max_lease * 60:
                  errors.append("expiresUtc - notBeforeUtc exceeds maxLeaseMinutes")

          if errors:
              print("::error::H1 record field verification failed: " + "; ".join(errors))
              sys.exit(1)

          print("H1 closed-schema field verification: OK")
          PYEOF

      - name: Independently query GitHub API for this run's server record (actor cross-check included)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          echo "$RESPONSE" > "$RUNNER_TEMP/nim367-h1/server-run-record.json"

          python3 - "$RUNNER_TEMP/nim367-h1/server-run-record.json" "$RUNNER_TEMP/nim367-h1/h1-record.json" <<'PYEOF'
          import json, os, sys

          with open(sys.argv[1]) as f:
              server = json.load(f)
          with open(sys.argv[2]) as f:
              h1 = json.load(f)

          errors = []
          if str(server.get("id")) != os.environ["GITHUB_RUN_ID"]:
              errors.append("server run id mismatch")
          if str(server.get("run_attempt")) != os.environ["GITHUB_RUN_ATTEMPT"]:
              errors.append("server run_attempt mismatch")
          if server.get("head_sha") != os.environ["EXPECTED_HEAD_SHA"]:
              errors.append("server head_sha mismatch")
          if server.get("event") != "workflow_dispatch":
              errors.append(f"server event is {server.get('event')!r}, expected workflow_dispatch")
          server_actor = (server.get("actor") or {}).get("login")
          if server_actor != h1.get("actor"):
              errors.append(f"server-recorded actor ({server_actor!r}) does not equal H1 record actor ({h1.get('actor')!r})")

          if errors:
              print("::error::independent server-record query disagrees with context/H1: " + "; ".join(errors))
              sys.exit(1)

          print("Independent server-record query: OK (server run id/attempt/head/event/actor confirmed, not self-report alone)")
          PYEOF

      - name: H1 barrier verified -- publish closed-schema downstream values
        id: finalize
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/nim367-h1/h1-record.json" >> "$GITHUB_OUTPUT" <<'PYEOF'
          import json, sys

          with open(sys.argv[1]) as f:
              record = json.load(f)

          print(f"approved_xcode_build={record['approvedXcodeBuild']}")
          print(f"approved_runner_image_os={record['approvedRunnerImageOS']}")
          print(f"approved_complete_tuple_sha256={record['approvedCompleteTupleSha256']}")
          print(f"approved_shared_state_manifest_sha256={record['approvedSharedStateManifestSha256']}")
          print(f"approved_gate_ref={record['approvedGateRef']}")
          print(f"approved_workflow_ref={record['workflowRef']}")
          print(f"approved_gate_commit={record['approvedGateCommit']}")
          print(f"approved_gate_tree={record['approvedGateTree']}")
          print(f"approved_gate_scheme={record['approvedGateScheme']}")
          print(f"approved_command_plan_hash={record['commandPlanHash']}")
          print(f"approved_locked_blobs_json={json.dumps(record['lockedBlobs'])}")
          PYEOF
          echo "h1_verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload H1 verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed release: v4
        with:
          name: nim367-h1-verify-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nim367-h1
          overwrite: false
          retention-days: 90

  nim367-identity-compile-focused:
    name: 'NIM-367 Gate 1: identity + strict compile + focused'
    if: github.event_name == 'workflow_dispatch'
    needs: [nim367-attest-only, nim367-h1-verify]
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    permissions:
      contents: read
    env:
      NIM367_REPAIR_SHA: ${{ inputs.repair_sha }}
    steps:
      - name: Verify exact-SHA and identity-lock inputs (closed-schema H1 outputs, not sibling vars)
        run: |
          set -euo pipefail
          if [ "${{ inputs.repair_sha }}" != "cd87e6047b30da9e166d9b2350726ad1d8554009" ]; then
            echo "::error::repair_sha does not equal the locked NIM-367 repair commit"
            exit 1
          fi
          case "${{ inputs.production_stress_iterations }}" in
            2[0-9]|3[0-9]|40) ;;
            *) echo "::error::production_stress_iterations out of canonical range 20..40"; exit 1 ;;
          esac
          if [ "${{ inputs.production_stress_seed }}" -lt 0 ] 2>/dev/null || [ "${{ inputs.production_stress_seed }}" -gt 4294967295 ] 2>/dev/null; then
            echo "::error::production_stress_seed out of canonical unsigned 32-bit range"
            exit 1
          fi
          if [ -z "${{ needs.nim367-h1-verify.outputs.approved_gate_ref }}" ] || [ -z "${{ needs.nim367-h1-verify.outputs.approved_gate_commit }}" ]; then
            echo "::error::H1-verified approved_gate_ref/approved_gate_commit are empty -- BLOCKED_ATTESTATION"
            exit 1
          fi
          if [ "${{ github.ref }}" != "${{ needs.nim367-h1-verify.outputs.approved_gate_ref }}" ]; then
            echo "::error::github.ref does not equal the H1-verified approved gate ref -- BLOCKED_ATTESTATION"
            exit 1
          fi
          if [ "${{ github.workflow_ref }}" != "${{ needs.nim367-h1-verify.outputs.approved_workflow_ref }}" ]; then
            echo "::error::github.workflow_ref does not equal the H1-verified approved workflow ref -- BLOCKED_ATTESTATION"
            exit 1
          fi
          if [ "${{ github.workflow_sha }}" != "${{ needs.nim367-h1-verify.outputs.approved_gate_commit }}" ] || [ "${{ github.sha }}" != "${{ needs.nim367-h1-verify.outputs.approved_gate_commit }}" ]; then
            echo "::error::github.workflow_sha/github.sha does not equal the H1-verified approved gate commit -- BLOCKED_ATTESTATION"
            exit 1
          fi

      - name: Setup Xcode (H1-approved build)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # reviewed release: v1 (v1.7.0)
        with:
          xcode-version: ${{ needs.nim367-h1-verify.outputs.approved_xcode_build }}

      - name: Verify + persist J attestation record (selected toolchain byte-for-byte vs H1, paginated server job lookup, clean stage root)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -d gate ] || [ -d sut ]; then
            echo "::error::J barrier: candidate/SUT directories already exist before this job's first checkout -- stage root is not clean -- BLOCKED_ATTESTATION"
            exit 1
          fi

          if [ -z "${{ needs.nim367-h1-verify.outputs.approved_runner_image_os }}" ] || \
             [ -z "${{ needs.nim367-h1-verify.outputs.approved_complete_tuple_sha256 }}" ] || \
             [ -z "${{ needs.nim367-h1-verify.outputs.approved_shared_state_manifest_sha256 }}" ]; then
            echo "::error::J barrier: H1-verified approved_runner_image_os/approved_complete_tuple_sha256/approved_shared_state_manifest_sha256 are empty -- BLOCKED_ATTESTATION, never a warning/pass approximation"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nim367-j"

          # Re-derive the identical "complete observed tuple" attest-only
          # computed, on THIS job's own runner, so a byte-for-byte string
          # comparison against H1's approved value is meaningful.
          XCODEBUILD_VERSION=$(xcodebuild -version)
          XCODEBUILD_HELP_HASH=$(xcodebuild -help 2>&1 | shasum -a 256 | cut -d' ' -f1)
          SWIFT_EXEC=$(xcrun --find swift)
          SWIFTC_EXEC=$(xcrun --find swiftc)
          SWIFT_VERSION_HASH=$("$SWIFT_EXEC" --version | shasum -a 256 | cut -d' ' -f1)
          SWIFTC_VERSION_HASH=$("$SWIFTC_EXEC" --version | shasum -a 256 | cut -d' ' -f1)
          SWIFT_PACKAGE_HELP_HASH=$("$SWIFT_EXEC" package --help 2>&1 | shasum -a 256 | cut -d' ' -f1)
          SWIFT_TEST_HELP_HASH=$("$SWIFT_EXEC" test --help 2>&1 | shasum -a 256 | cut -d' ' -f1)
          SW_VERS_HASH=$(sw_vers | shasum -a 256 | cut -d' ' -f1)
          XCODE_BUILD=$(echo "$XCODEBUILD_VERSION" | grep -o 'Build version [A-Za-z0-9]*' | sed 's/Build version //')

          python3 - > "$RUNNER_TEMP/nim367-j/shared-state-manifest.json" <<'PYEOF'
          import json, os
          roots = [
              os.path.expanduser("~/Library/Caches/org.swift.swiftpm"),
              os.path.expanduser("~/Library/org.swift.swiftpm"),
              os.path.expanduser("~/.swiftpm"),
              os.path.expanduser("~/Library/Developer/Xcode/DerivedData"),
          ]
          manifest = []
          for root in sorted(roots):
              if not os.path.exists(root):
                  manifest.append({"root": root, "state": "absent"})
                  continue
              entries = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames.sort()
                  for name in sorted(filenames):
                      full = os.path.join(dirpath, name)
                      try:
                          size = os.path.getsize(full)
                      except OSError:
                          size = -1
                      entries.append({"path": os.path.relpath(full, root), "size": size})
              manifest.append({"root": root, "state": "present", "entryCount": len(entries), "entries": entries})
          print(json.dumps(manifest, sort_keys=True))
          PYEOF
          SHARED_STATE_MANIFEST_HASH=$(shasum -a 256 "$RUNNER_TEMP/nim367-j/shared-state-manifest.json" | cut -d' ' -f1)

          cat > "$RUNNER_TEMP/nim367-j/attestation-recompute.json" <<EOF
          {
            "schema": "nim367.attest-only.v2",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "repository": "${{ github.repository }}",
            "workflowRef": "${{ github.workflow_ref }}",
            "workflowSha": "${{ github.workflow_sha }}",
            "headRef": "${{ github.ref }}",
            "headSha": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "runnerOs": "${{ runner.os }}",
            "runnerArch": "${{ runner.arch }}",
            "runnerName": "${{ runner.name }}",
            "xcodeSelectP": $(xcode-select -p | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
            "xcodebuildVersion": $(echo "$XCODEBUILD_VERSION" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
            "xcodebuildHelpHash": "$XCODEBUILD_HELP_HASH",
            "swiftExecRealpath": "$SWIFT_EXEC",
            "swiftcExecRealpath": "$SWIFTC_EXEC",
            "swiftVersionHash": "$SWIFT_VERSION_HASH",
            "swiftcVersionHash": "$SWIFTC_VERSION_HASH",
            "swiftPackageHelpHash": "$SWIFT_PACKAGE_HELP_HASH",
            "swiftTestHelpHash": "$SWIFT_TEST_HELP_HASH",
            "swVersHash": "$SW_VERS_HASH",
            "sharedStateManifestSha256": "$SHARED_STATE_MANIFEST_HASH"
          }
          EOF
          OBSERVED_COMPLETE_TUPLE_SHA256=$(shasum -a 256 "$RUNNER_TEMP/nim367-j/attestation-recompute.json" | cut -d' ' -f1)

          if [ "$XCODE_BUILD" != "${{ needs.nim367-h1-verify.outputs.approved_xcode_build }}" ]; then
            echo "::error::J barrier: this job's selected Xcode build ($XCODE_BUILD) does not equal the H1-approved Xcode build -- BLOCKED_ATTESTATION"
            exit 1
          fi
          if [ "${ImageOS:-unset}" != "${{ needs.nim367-h1-verify.outputs.approved_runner_image_os }}" ]; then
            echo "::error::J barrier: runner image OS (\$ImageOS=${ImageOS:-unset}) does not equal the H1-approved runner image OS -- BLOCKED_ATTESTATION, never a warning"
            exit 1
          fi
          if [ "$SHARED_STATE_MANIFEST_HASH" != "${{ needs.nim367-h1-verify.outputs.approved_shared_state_manifest_sha256 }}" ]; then
            echo "::error::J barrier: this job's shared-state manifest does not equal the H1-approved manifest byte-for-byte -- BLOCKED_ATTESTATION"
            exit 1
          fi

          # Independently query this job's own server-recorded identity via a
          # FULLY PAGINATED Jobs API walk (follows Link: rel="next" until
          # GitHub reports no further page), requiring EXACTLY ONE
          # unambiguous match by runner_name -- zero or multiple matches both
          # fail closed rather than guessing.
          JOBS_ALL="$RUNNER_TEMP/nim367-j/jobs-all.json"
          echo "[]" > "$JOBS_ALL"
          NEXT_URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"
          PAGE=1
          while [ -n "$NEXT_URL" ]; do
            HEADERS_FILE="$RUNNER_TEMP/nim367-j/jobs-headers-$PAGE.txt"
            BODY_FILE="$RUNNER_TEMP/nim367-j/jobs-body-$PAGE.json"
            curl -sf -D "$HEADERS_FILE" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$NEXT_URL" -o "$BODY_FILE"
            python3 - "$JOBS_ALL" "$BODY_FILE" <<'PYEOF'
          import json, sys
          all_path, body_path = sys.argv[1], sys.argv[2]
          with open(all_path) as f:
              all_jobs = json.load(f)
          with open(body_path) as f:
              body = json.load(f)
          all_jobs.extend(body.get("jobs", []))
          with open(all_path, "w") as f:
              json.dump(all_jobs, f)
          PYEOF
            NEXT_URL=$(grep -i '^link:' "$HEADERS_FILE" | grep -o '<[^>]*>; rel="next"' | sed -E 's/<(.*)>.*/\1/' || true)
            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 20 ]; then
              echo "::error::J barrier: pagination exceeded 20 pages, aborting to avoid unbounded loop"
              exit 1
            fi
          done

          MATCH_RESULT=$(python3 - "$JOBS_ALL" <<'PYEOF'
          import json, os, sys
          with open(sys.argv[1]) as f:
              jobs = json.load(f)
          runner_name = os.environ.get("RUNNER_NAME", "")
          matches = [j for j in jobs if j.get("runner_name") == runner_name]
          if len(matches) == 0:
              print("NO_MATCH")
          elif len(matches) > 1:
              print("AMBIGUOUS_MATCH")
          else:
              m = matches[0]
              print(json.dumps({
                  "id": m.get("id"), "runner_name": m.get("runner_name"),
                  "runner_group_name": m.get("runner_group_name"),
                  "labels": m.get("labels"), "status": m.get("status"),
              }))
          PYEOF
          )

          if [ "$MATCH_RESULT" = "NO_MATCH" ] || [ "$MATCH_RESULT" = "AMBIGUOUS_MATCH" ]; then
            echo "::error::J barrier: server job-ID lookup failed ($MATCH_RESULT) after complete pagination -- BLOCKED_ATTESTATION"
            exit 1
          fi

          # Persist the J record before checkout, binding H0/H1/run/attempt,
          # the server job identity, the observed complete tuple, and the
          # clean-stage-root proof, per the closed-schema repair brief.
          python3 - "$RUNNER_TEMP/nim367-j/j-record.json" <<PYEOF
          import json
          record = {
              "schema": "nim367.j.v1",
              "runId": "${{ github.run_id }}",
              "runAttempt": "${{ github.run_attempt }}",
              "job": "${{ github.job }}",
              "h1RecordSha256": "${{ needs.nim367-h1-verify.outputs.h1_record_sha256 }}",
              "serverJobRecord": json.loads('''$MATCH_RESULT'''),
              "selectedXcodeBuild": "$XCODE_BUILD",
              "observedCompleteTupleSha256": "$OBSERVED_COMPLETE_TUPLE_SHA256",
              "approvedCompleteTupleSha256Expected": "${{ needs.nim367-h1-verify.outputs.approved_complete_tuple_sha256 }}",
              "sharedStateManifestSha256": "$SHARED_STATE_MANIFEST_HASH",
              "cleanStageRootVerified": True,
          }
          with open("$RUNNER_TEMP/nim367-j/j-record.json", "w") as f:
              json.dump(record, f, indent=2)
          PYEOF
          echo "J barrier server job record: $MATCH_RESULT"

          if [ "$OBSERVED_COMPLETE_TUPLE_SHA256" != "${{ needs.nim367-h1-verify.outputs.approved_complete_tuple_sha256 }}" ]; then
            echo "::error::J barrier: this job's selected-toolchain complete tuple does not equal H1's approved complete tuple byte-for-byte -- BLOCKED_ATTESTATION"
            exit 1
          fi

          echo "J attestation barrier: OK and persisted -- selected toolchain ($XCODE_BUILD), byte-for-byte tuple match, server job record, shared-state manifest, and clean stage root all verified before checkout"

      - name: Checkout gate (sealed, workflow_sha)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # reviewed release: v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SUT (sealed, exact repair SHA)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # reviewed release: v5.0.0
        with:
          ref: ${{ inputs.repair_sha }}
          path: sut
          fetch-depth: 2
          persist-credentials: false

      - name: Verify sealed-checkout identity, locked-blob tuple, command-plan hash, and clean status
        run: |
          set -euo pipefail
          GATE_HEAD=$(git -C gate rev-parse HEAD)
          GATE_TREE=$(git -C gate rev-parse HEAD^{tree})
          if [ "$GATE_HEAD" != "${{ needs.nim367-h1-verify.outputs.approved_gate_commit }}" ] || [ "$GATE_TREE" != "${{ needs.nim367-h1-verify.outputs.approved_gate_tree }}" ]; then
            echo "::error::gate checkout HEAD/tree does not match the H1-verified approved record -- BLOCKED_ATTESTATION"
            exit 1
          fi
          SUT_HEAD=$(git -C sut rev-parse HEAD)
          SUT_PARENT=$(git -C sut rev-parse HEAD^)
          SUT_TREE=$(git -C sut rev-parse HEAD^{tree})
          if [ "$SUT_HEAD" != "cd87e6047b30da9e166d9b2350726ad1d8554009" ] || \
             [ "$SUT_PARENT" != "7ec725a456c230751c70a3d7269fc89fd6ce55ca" ] || \
             [ "$SUT_TREE" != "f9767e7febafee27347b55ab9a6eee6595d4dbe4" ]; then
            echo "::error::SUT checkout HEAD/parent/tree does not match the locked repair identity"
            exit 1
          fi
          DIFF_PATHS=$(git -C sut diff-tree --no-commit-id --name-status -r HEAD | sort)
          EXPECTED_PATHS=$(printf 'M\tpackages/ios/NimbalystNative/Sources/Sync/DocumentSyncManager.swift\nM\tpackages/ios/NimbalystNative/Sources/Sync/SyncManager.swift\nM\tpackages/ios/NimbalystNative/Sources/Sync/WebSocketClient.swift\nM\tpackages/ios/NimbalystNative/Tests/SessionFeedContinuityTests.swift\n' | sort)
          if [ "$DIFF_PATHS" != "$EXPECTED_PATHS" ]; then
            echo "::error::SUT diff-tree does not equal exactly the four recorded repair paths"
            exit 1
          fi
          for repo in gate sut; do
            git -C "$repo" status --porcelain=v1 --untracked-files=all > "$repo-status-untracked.txt"
            git -C "$repo" status --ignored=matching --porcelain=v1 > "$repo-status-ignored.txt"
            if [ -s "$repo-status-untracked.txt" ] || [ -s "$repo-status-ignored.txt" ]; then
              echo "::error::$repo checkout is not clean (untracked or ignored-matching entries present)"
              exit 1
            fi
          done

          # Locked path-to-blob tuple: H1's own record must exactly equal
          # what was actually checked out, closing the "candidate commit/tree
          # and path-to-blob tuple" requirement of the closed schema.
          python3 - <<PYEOF
          import json, subprocess, sys

          locked_blobs = json.loads('''${{ needs.nim367-h1-verify.outputs.approved_locked_blobs_json }}''')
          for path, expected_blob in locked_blobs.items():
              actual_blob = subprocess.check_output(
                  ["git", "-C", "gate", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              if actual_blob != expected_blob:
                  print(f"::error::locked path {path} blob {actual_blob} does not equal H1-approved blob {expected_blob} -- BLOCKED_ATTESTATION")
                  sys.exit(1)
          print("Locked path-to-blob tuple: OK, matches H1 record exactly")
          PYEOF

          # Command-plan hash: hash the checked-out workflow file itself and
          # compare to H1's commandPlanHash. This is the first point in the
          # run where the actual command plan is on disk to hash -- h1-verify
          # itself performs no checkout, by design (see its header comment).
          ACTUAL_COMMAND_PLAN_HASH=$(shasum -a 256 gate/.github/workflows/ios-transcript-tests.yml | cut -d' ' -f1)
          if [ "$ACTUAL_COMMAND_PLAN_HASH" != "${{ needs.nim367-h1-verify.outputs.approved_command_plan_hash }}" ]; then
            echo "::error::checked-out workflow file hash ($ACTUAL_COMMAND_PLAN_HASH) does not equal H1's approved commandPlanHash -- BLOCKED_ATTESTATION"
            exit 1
          fi
          echo "Command-plan hash: OK, matches H1 record exactly"

      - name: Materialize watchdog wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/nim367"
          cat > "$RUNNER_TEMP/nim367/watchdog.py" <<'PYEOF'
          import argparse, json, os, signal, subprocess, sys, time

          def main():
              p = argparse.ArgumentParser()
              p.add_argument("--timeout-seconds", type=int, required=True)
              p.add_argument("--term-grace-seconds", type=int, default=15)
              p.add_argument("--stdout", required=True)
              p.add_argument("--stderr", required=True)
              p.add_argument("--combined-log", required=True)
              p.add_argument("--status", required=True)
              p.add_argument("cmd", nargs=argparse.REMAINDER)
              args = p.parse_args()
              cmd = args.cmd[1:] if args.cmd and args.cmd[0] == "--" else args.cmd

              start = time.time()
              start_utc = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              with open(args.stdout, "wb") as out_f, open(args.stderr, "wb") as err_f:
                  proc = subprocess.Popen(cmd, stdout=out_f, stderr=err_f, start_new_session=True)
                  timed_out = False
                  try:
                      proc.wait(timeout=args.timeout_seconds)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      os.killpg(os.getpgid(proc.pid), signal.SIGTERM)
                      try:
                          proc.wait(timeout=args.term_grace_seconds)
                      except subprocess.TimeoutExpired:
                          os.killpg(os.getpgid(proc.pid), signal.SIGKILL)
                          proc.wait()
              end = time.time()
              end_utc = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              exit_code = 124 if timed_out else proc.returncode

              with open(args.stdout, "rb") as out_f, open(args.stderr, "rb") as err_f, open(args.combined_log, "wb") as combined:
                  combined.write(b"--- stdout ---\n")
                  combined.write(out_f.read())
                  combined.write(b"--- stderr ---\n")
                  combined.write(err_f.read())

              status = {
                  "startUtc": start_utc,
                  "endUtc": end_utc,
                  "elapsedSeconds": end - start,
                  "pid": proc.pid,
                  "command": cmd,
                  "exitCode": exit_code,
                  "timedOut": timed_out,
              }
              with open(args.status, "w") as status_f:
                  json.dump(status, status_f)

              sys.exit(exit_code)

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Mechanical dependency-equivalence gate
        run: |
          python3 - <<'PYEOF'
          import json, sys

          def load(path):
              with open(path) as f:
                  return json.load(f)

          sut_pins = load("sut/packages/ios/NimbalystNative/Package.resolved")["pins"]
          gate_pins = load("gate/packages/ios/NimbalystAppleGate/Package.resolved")["pins"]

          def canon(pins):
              out = []
              for pin in pins:
                  state = pin["state"]
                  out.append((pin["identity"], pin["kind"], pin["location"], state.get("revision"), state.get("version")))
              return sorted(out)

          required = {
              "grdb.swift": "aa0079aeb82a4bf00324561a40bffe68c6fe1c26",
              "posthog-ios": "1ba3e8636d4f1ad9f18f5a4273e88d39a162466b",
          }
          gate_by_id = {pin["identity"]: pin for pin in gate_pins}
          for identity, revision in required.items():
              if identity not in gate_by_id:
                  print(f"::error::missing required dependency {identity}", file=sys.stderr)
                  sys.exit(1)
              if gate_by_id[identity]["state"].get("revision") != revision:
                  print(f"::error::{identity} revision does not equal the locked immutable revision", file=sys.stderr)
                  sys.exit(1)
          if len(gate_pins) != len(required):
              print("::error::gate Package.resolved declares an unapproved additional dependency", file=sys.stderr)
              sys.exit(1)
          print("Mechanical dependency-equivalence gate: OK")
          PYEOF

      - name: Gate 1 -- scheme preflight, strict compile, focused execution
        env:
          RESOLVER_ROOT: ${{ runner.temp }}/nim367/resolver
        run: |
          set -euo pipefail
          mkdir -p "$RESOLVER_ROOT"/{cache,configuration,security,scratch,clones,receipts}
          SWIFT_EXEC=$(xcrun --find swift)
          SWIFTC_EXEC=$(xcrun --find swiftc)
          echo "SWIFT_EXEC=$SWIFT_EXEC" >> "$GITHUB_ENV"
          echo "SWIFTC_EXEC=$SWIFTC_EXEC" >> "$GITHUB_ENV"
          "$SWIFT_EXEC" --version
          "$SWIFTC_EXEC" --version
          xcode-select -p
          xcodebuild -version

          cd gate/packages/ios/NimbalystAppleGate
          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 300 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/dump-package.stdout" \
            --stderr "$RUNNER_TEMP/nim367/dump-package.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/dump-package.log" \
            --status "$RUNNER_TEMP/nim367/dump-package.watchdog.json" \
            -- "$SWIFT_EXEC" package \
              --package-path "$GITHUB_WORKSPACE/gate/packages/ios/NimbalystAppleGate" \
              --cache-path "$RESOLVER_ROOT/cache" \
              --config-path "$RESOLVER_ROOT/configuration" \
              --security-path "$RESOLVER_ROOT/security" \
              --scratch-path "$RESOLVER_ROOT/scratch" \
              dump-package

          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 120 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/scheme-list.stdout" \
            --stderr "$RUNNER_TEMP/nim367/scheme-list.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/scheme-list.log" \
            --status "$RUNNER_TEMP/nim367/scheme-list.watchdog.json" \
            -- xcodebuild -list -json \
              -disableAutomaticPackageResolution \
              -onlyUsePackageVersionsFromResolvedFile \
              -clonedSourcePackagesDirPath "$RESOLVER_ROOT/clones"

          if ! grep -q "${{ needs.nim367-h1-verify.outputs.approved_gate_scheme }}" "$RUNNER_TEMP/nim367/scheme-list.stdout"; then
            echo "::error::approved test-bearing scheme not present in observed scheme list"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/sut/packages/ios/NimbalystNative"
          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 900 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/swift-focused.stdout" \
            --stderr "$RUNNER_TEMP/nim367/swift-focused.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/swift-focused.log" \
            --status "$RUNNER_TEMP/nim367/swift-focused.watchdog.json" \
            -- "$SWIFT_EXEC" test \
              --package-path "$GITHUB_WORKSPACE/sut/packages/ios/NimbalystNative" \
              --cache-path "$RESOLVER_ROOT/cache" \
              --config-path "$RESOLVER_ROOT/configuration" \
              --security-path "$RESOLVER_ROOT/security" \
              --disable-automatic-resolution \
              --scratch-path "$RESOLVER_ROOT/scratch" \
              --filter SessionFeedContinuityTests \
              -Xswiftc -swift-version -Xswiftc 6 \
              -Xswiftc -strict-concurrency=complete

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail
          SIMULATOR_UDID=$(xcrun simctl list -j devices available | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      print(device['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Gate 1 -- strict build and focused xctest
        env:
          RESOLVER_ROOT: ${{ runner.temp }}/nim367/resolver
        run: |
          set -euo pipefail
          cd sut/packages/ios/NimbalystNative
          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 900 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/strict-build.stdout" \
            --stderr "$RUNNER_TEMP/nim367/strict-build.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/strict-build.log" \
            --status "$RUNNER_TEMP/nim367/strict-build.watchdog.json" \
            -- xcodebuild build \
              -scheme NimbalystNative \
              -destination "$IOS_SIMULATOR_DESTINATION" \
              -skipPackagePluginValidation \
              -disableAutomaticPackageResolution \
              -onlyUsePackageVersionsFromResolvedFile \
              -clonedSourcePackagesDirPath "$RESOLVER_ROOT/clones" \
              -derivedDataPath "$RUNNER_TEMP/nim367/DerivedData/strict-build" \
              SWIFT_VERSION=6 \
              SWIFT_STRICT_CONCURRENCY=complete \
              -resultBundlePath "$RUNNER_TEMP/nim367/compile/strict-build.xcresult"

          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 900 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/focused.stdout" \
            --stderr "$RUNNER_TEMP/nim367/focused.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/focused.log" \
            --status "$RUNNER_TEMP/nim367/focused.watchdog.json" \
            -- xcodebuild test \
              -scheme NimbalystNative \
              -destination "$IOS_SIMULATOR_DESTINATION" \
              -skipPackagePluginValidation \
              -disableAutomaticPackageResolution \
              -onlyUsePackageVersionsFromResolvedFile \
              -clonedSourcePackagesDirPath "$RESOLVER_ROOT/clones" \
              -only-testing:NimbalystNativeTests/SessionFeedContinuityTests \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 30 \
              -maximum-test-execution-time-allowance 60 \
              -derivedDataPath "$RUNNER_TEMP/nim367/DerivedData/focused" \
              SWIFT_VERSION=6 \
              SWIFT_STRICT_CONCURRENCY=complete \
              -resultBundlePath "$RUNNER_TEMP/nim367/focused/focused-tests.xcresult"

      - name: Credential and retained-text scan
        if: always()
        run: |
          python3 - <<'PYEOF'
          import re, sys, pathlib

          SYNTHETIC_TOKEN = "nim367-loopback-public-token-v1"
          PATTERNS = [
              re.compile(r"[Bb]earer\s+[A-Za-z0-9\-._~+/]+=*"),
              re.compile(r"[Aa]uthorization:\s*[Bb]asic\s+[A-Za-z0-9+/=]+"),
              re.compile(r"eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+"),
              re.compile(r"[?&](token|jwt|auth|key|secret)=([^&\s]+)"),
          ]

          root = pathlib.Path("${{ runner.temp }}/nim367")
          findings = []
          for path in root.glob("*.log"):
              text = path.read_text(errors="replace")
              for pattern in PATTERNS:
                  for match in pattern.finditer(text):
                      value = match.group(0)
                      if SYNTHETIC_TOKEN in value:
                          continue
                      findings.append((str(path), pattern.pattern))
          if findings:
              print("::error::retained-text scan found unexpected credential-shaped content")
              for path, pattern in findings:
                  print(f"  {path}: {pattern}")
              sys.exit(1)
          print("Credential and retained-text scan: OK (no unexpected matches)")
          PYEOF

      - name: Package and hash evidence
        if: always()
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/nim367-package/payload"
          mkdir -p "$PKG"
          cp "$RUNNER_TEMP/nim367-j/j-record.json" "$PKG"/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/nim367/*.log "$PKG"/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/nim367/*.watchdog.json "$PKG"/ 2>/dev/null || true
          find "$RUNNER_TEMP/nim367" -name '*.xcresult' -exec cp -R {} "$PKG"/ \; 2>/dev/null || true
          (cd "$RUNNER_TEMP/nim367-package" && find payload -type f | sort | xargs -I{} shasum -a 256 {} > SHA256SUMS)
          (cd "$RUNNER_TEMP/nim367-package" && shasum -a 256 SHA256SUMS > SHA256SUMS.sha256)

      - name: Upload gate 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed release: v4
        with:
          name: nim367-compile-focused-${{ inputs.repair_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nim367-package
          overwrite: false
          retention-days: 90

  nim367-deterministic-stress:
    name: 'NIM-367 Gate 2: deterministic 20x stress'
    if: github.event_name == 'workflow_dispatch'
    needs: [nim367-attest-only, nim367-h1-verify, nim367-identity-compile-focused]
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    steps:
      - name: Setup Xcode (H1-approved build)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # reviewed release: v1 (v1.7.0)
        with:
          xcode-version: ${{ needs.nim367-h1-verify.outputs.approved_xcode_build }}

      - name: Verify + persist J attestation record (selected toolchain byte-for-byte vs H1, paginated server job lookup, clean stage root)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -d gate ] || [ -d sut ]; then
            echo "::error::J barrier: candidate/SUT directories already exist before this job's first checkout -- stage root is not clean -- BLOCKED_ATTESTATION"
            exit 1
          fi
          if [ -z "${{ needs.nim367-h1-verify.outputs.approved_runner_image_os }}" ] || \
             [ -z "${{ needs.nim367-h1-verify.outputs.approved_complete_tuple_sha256 }}" ] || \
             [ -z "${{ needs.nim367-h1-verify.outputs.approved_shared_state_manifest_sha256 }}" ]; then
            echo "::error::J barrier: H1-verified approved_runner_image_os/approved_complete_tuple_sha256/approved_shared_state_manifest_sha256 are empty -- BLOCKED_ATTESTATION, never a warning/pass approximation"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nim367-j"

          XCODEBUILD_VERSION=$(xcodebuild -version)
          XCODEBUILD_HELP_HASH=$(xcodebuild -help 2>&1 | shasum -a 256 | cut -d' ' -f1)
          SWIFT_EXEC=$(xcrun --find swift)
          SWIFTC_EXEC=$(xcrun --find swiftc)
          SWIFT_VERSION_HASH=$("$SWIFT_EXEC" --version | shasum -a 256 | cut -d' ' -f1)
          SWIFTC_VERSION_HASH=$("$SWIFTC_EXEC" --version | shasum -a 256 | cut -d' ' -f1)
          SWIFT_PACKAGE_HELP_HASH=$("$SWIFT_EXEC" package --help 2>&1 | shasum -a 256 | cut -d' ' -f1)
          SWIFT_TEST_HELP_HASH=$("$SWIFT_EXEC" test --help 2>&1 | shasum -a 256 | cut -d' ' -f1)
          SW_VERS_HASH=$(sw_vers | shasum -a 256 | cut -d' ' -f1)
          XCODE_BUILD=$(echo "$XCODEBUILD_VERSION" | grep -o 'Build version [A-Za-z0-9]*' | sed 's/Build version //')

          python3 - > "$RUNNER_TEMP/nim367-j/shared-state-manifest.json" <<'PYEOF'
          import json, os
          roots = [
              os.path.expanduser("~/Library/Caches/org.swift.swiftpm"),
              os.path.expanduser("~/Library/org.swift.swiftpm"),
              os.path.expanduser("~/.swiftpm"),
              os.path.expanduser("~/Library/Developer/Xcode/DerivedData"),
          ]
          manifest = []
          for root in sorted(roots):
              if not os.path.exists(root):
                  manifest.append({"root": root, "state": "absent"})
                  continue
              entries = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames.sort()
                  for name in sorted(filenames):
                      full = os.path.join(dirpath, name)
                      try:
                          size = os.path.getsize(full)
                      except OSError:
                          size = -1
                      entries.append({"path": os.path.relpath(full, root), "size": size})
              manifest.append({"root": root, "state": "present", "entryCount": len(entries), "entries": entries})
          print(json.dumps(manifest, sort_keys=True))
          PYEOF
          SHARED_STATE_MANIFEST_HASH=$(shasum -a 256 "$RUNNER_TEMP/nim367-j/shared-state-manifest.json" | cut -d' ' -f1)

          cat > "$RUNNER_TEMP/nim367-j/attestation-recompute.json" <<EOF
          {
            "schema": "nim367.attest-only.v2",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "repository": "${{ github.repository }}",
            "workflowRef": "${{ github.workflow_ref }}",
            "workflowSha": "${{ github.workflow_sha }}",
            "headRef": "${{ github.ref }}",
            "headSha": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "runnerOs": "${{ runner.os }}",
            "runnerArch": "${{ runner.arch }}",
            "runnerName": "${{ runner.name }}",
            "xcodeSelectP": $(xcode-select -p | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
            "xcodebuildVersion": $(echo "$XCODEBUILD_VERSION" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
            "xcodebuildHelpHash": "$XCODEBUILD_HELP_HASH",
            "swiftExecRealpath": "$SWIFT_EXEC",
            "swiftcExecRealpath": "$SWIFTC_EXEC",
            "swiftVersionHash": "$SWIFT_VERSION_HASH",
            "swiftcVersionHash": "$SWIFTC_VERSION_HASH",
            "swiftPackageHelpHash": "$SWIFT_PACKAGE_HELP_HASH",
            "swiftTestHelpHash": "$SWIFT_TEST_HELP_HASH",
            "swVersHash": "$SW_VERS_HASH",
            "sharedStateManifestSha256": "$SHARED_STATE_MANIFEST_HASH"
          }
          EOF
          OBSERVED_COMPLETE_TUPLE_SHA256=$(shasum -a 256 "$RUNNER_TEMP/nim367-j/attestation-recompute.json" | cut -d' ' -f1)

          if [ "$XCODE_BUILD" != "${{ needs.nim367-h1-verify.outputs.approved_xcode_build }}" ]; then
            echo "::error::J barrier: this job's selected Xcode build ($XCODE_BUILD) does not equal the H1-approved Xcode build -- BLOCKED_ATTESTATION"
            exit 1
          fi
          if [ "${ImageOS:-unset}" != "${{ needs.nim367-h1-verify.outputs.approved_runner_image_os }}" ]; then
            echo "::error::J barrier: runner image OS (\$ImageOS=${ImageOS:-unset}) does not equal the H1-approved runner image OS -- BLOCKED_ATTESTATION, never a warning"
            exit 1
          fi
          if [ "$SHARED_STATE_MANIFEST_HASH" != "${{ needs.nim367-h1-verify.outputs.approved_shared_state_manifest_sha256 }}" ]; then
            echo "::error::J barrier: this job's shared-state manifest does not equal the H1-approved manifest byte-for-byte -- BLOCKED_ATTESTATION"
            exit 1
          fi

          JOBS_ALL="$RUNNER_TEMP/nim367-j/jobs-all.json"
          echo "[]" > "$JOBS_ALL"
          NEXT_URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"
          PAGE=1
          while [ -n "$NEXT_URL" ]; do
            HEADERS_FILE="$RUNNER_TEMP/nim367-j/jobs-headers-$PAGE.txt"
            BODY_FILE="$RUNNER_TEMP/nim367-j/jobs-body-$PAGE.json"
            curl -sf -D "$HEADERS_FILE" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$NEXT_URL" -o "$BODY_FILE"
            python3 - "$JOBS_ALL" "$BODY_FILE" <<'PYEOF'
          import json, sys
          all_path, body_path = sys.argv[1], sys.argv[2]
          with open(all_path) as f:
              all_jobs = json.load(f)
          with open(body_path) as f:
              body = json.load(f)
          all_jobs.extend(body.get("jobs", []))
          with open(all_path, "w") as f:
              json.dump(all_jobs, f)
          PYEOF
            NEXT_URL=$(grep -i '^link:' "$HEADERS_FILE" | grep -o '<[^>]*>; rel="next"' | sed -E 's/<(.*)>.*/\1/' || true)
            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 20 ]; then
              echo "::error::J barrier: pagination exceeded 20 pages, aborting to avoid unbounded loop"
              exit 1
            fi
          done

          MATCH_RESULT=$(python3 - "$JOBS_ALL" <<'PYEOF'
          import json, os, sys
          with open(sys.argv[1]) as f:
              jobs = json.load(f)
          runner_name = os.environ.get("RUNNER_NAME", "")
          matches = [j for j in jobs if j.get("runner_name") == runner_name]
          if len(matches) == 0:
              print("NO_MATCH")
          elif len(matches) > 1:
              print("AMBIGUOUS_MATCH")
          else:
              m = matches[0]
              print(json.dumps({
                  "id": m.get("id"), "runner_name": m.get("runner_name"),
                  "runner_group_name": m.get("runner_group_name"),
                  "labels": m.get("labels"), "status": m.get("status"),
              }))
          PYEOF
          )

          if [ "$MATCH_RESULT" = "NO_MATCH" ] || [ "$MATCH_RESULT" = "AMBIGUOUS_MATCH" ]; then
            echo "::error::J barrier: server job-ID lookup failed ($MATCH_RESULT) after complete pagination -- BLOCKED_ATTESTATION"
            exit 1
          fi

          python3 - "$RUNNER_TEMP/nim367-j/j-record.json" <<PYEOF
          import json
          record = {
              "schema": "nim367.j.v1",
              "runId": "${{ github.run_id }}",
              "runAttempt": "${{ github.run_attempt }}",
              "job": "${{ github.job }}",
              "h1RecordSha256": "${{ needs.nim367-h1-verify.outputs.h1_record_sha256 }}",
              "serverJobRecord": json.loads('''$MATCH_RESULT'''),
              "selectedXcodeBuild": "$XCODE_BUILD",
              "observedCompleteTupleSha256": "$OBSERVED_COMPLETE_TUPLE_SHA256",
              "approvedCompleteTupleSha256Expected": "${{ needs.nim367-h1-verify.outputs.approved_complete_tuple_sha256 }}",
              "sharedStateManifestSha256": "$SHARED_STATE_MANIFEST_HASH",
              "cleanStageRootVerified": True,
          }
          with open("$RUNNER_TEMP/nim367-j/j-record.json", "w") as f:
              json.dump(record, f, indent=2)
          PYEOF
          echo "J barrier server job record: $MATCH_RESULT"

          if [ "$OBSERVED_COMPLETE_TUPLE_SHA256" != "${{ needs.nim367-h1-verify.outputs.approved_complete_tuple_sha256 }}" ]; then
            echo "::error::J barrier: this job's selected-toolchain complete tuple does not equal H1's approved complete tuple byte-for-byte -- BLOCKED_ATTESTATION"
            exit 1
          fi

          echo "J attestation barrier: OK and persisted -- selected toolchain ($XCODE_BUILD), byte-for-byte tuple match, server job record, shared-state manifest, and clean stage root all verified before checkout"

      - name: Checkout SUT (sealed, exact repair SHA)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # reviewed release: v5.0.0
        with:
          ref: ${{ inputs.repair_sha }}
          path: sut
          fetch-depth: 2
          persist-credentials: false

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail
          SIMULATOR_UDID=$(xcrun simctl list -j devices available | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      print(device['udid'])
