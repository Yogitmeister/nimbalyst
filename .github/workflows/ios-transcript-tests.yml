          for root in sorted(roots):
              if not os.path.exists(root):
                  manifest.append({"root": root, "state": "absent"})
                  continue
              entries = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames.sort()
                  for name in sorted(filenames):
                      full = os.path.join(dirpath, name)
                      try:
                          size = os.path.getsize(full)
                      except OSError:
                          size = -1
                      entries.append({"path": os.path.relpath(full, root), "size": size})
              manifest.append({"root": root, "state": "present", "entryCount": len(entries), "entries": entries})
          print(json.dumps(manifest, sort_keys=True))
          PYEOF
          SHARED_STATE_MANIFEST_HASH=$(shasum -a 256 "$RUNNER_TEMP/nim367-j/shared-state-manifest.json" | cut -d' ' -f1)

