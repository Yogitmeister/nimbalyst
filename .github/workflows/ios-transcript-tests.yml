      - name: Checkout gate (sealed, workflow_sha)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # reviewed release: v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          fetch-depth: 1
