            exit 1
          fi

          JOBS_ALL="$RUNNER_TEMP/nim367-j/jobs-all.json"
          echo "[]" > "$JOBS_ALL"
          NEXT_URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"
          PAGE=1
          while [ -n "$NEXT_URL" ]; do
            HEADERS_FILE="$RUNNER_TEMP/nim367-j/jobs-headers-$PAGE.txt"
            BODY_FILE="$RUNNER_TEMP/nim367-j/jobs-body-$PAGE.json"
            curl -sf -D "$HEADERS_FILE" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$NEXT_URL" -o "$BODY_FILE"
            python3 - "$JOBS_ALL" "$BODY_FILE" <<'PYEOF'
          import json, sys
          all_path, body_path = sys.argv[1], sys.argv[2]
          with open(all_path) as f:
              all_jobs = json.load(f)
          with open(body_path) as f:
              body = json.load(f)
          all_jobs.extend(body.get("jobs", []))
          with open(all_path, "w") as f:
              json.dump(all_jobs, f)
          PYEOF
            NEXT_URL=$(grep -i '^link:' "$HEADERS_FILE" | grep -o '<[^>]*>; rel="next"' | sed -E 's/<(.*)>.*/\1/' || true)
            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 20 ]; then
              echo "::error::J barrier: pagination exceeded 20 pages, aborting to avoid unbounded loop"
              exit 1
            fi
          done

          MATCH_RESULT=$(python3 - "$JOBS_ALL" <<'PYEOF'
          import json, os, sys
          with open(sys.argv[1]) as f:
              jobs = json.load(f)
          runner_name = os.environ.get("RUNNER_NAME", "")
          matches = [j for j in jobs if j.get("runner_name") == runner_name]
          if len(matches) == 0:
              print("NO_MATCH")
          elif len(matches) > 1:
              print("AMBIGUOUS_MATCH")
          else:
              m = matches[0]
              print(json.dumps({
                  "id": m.get("id"), "runner_name": m.get("runner_name"),
                  "runner_group_name": m.get("runner_group_name"),
                  "labels": m.get("labels"), "status": m.get("status"),
              }))
          PYEOF
          )

          if [ "$MATCH_RESULT" = "NO_MATCH" ] || [ "$MATCH_RESULT" = "AMBIGUOUS_MATCH" ]; then
            echo "::error::J barrier: server job-ID lookup failed ($MATCH_RESULT) after complete pagination -- BLOCKED_ATTESTATION"
            exit 1
          fi

          python3 - "$RUNNER_TEMP/nim367-j/j-record.json" <<PYEOF
          import json
          record = {
              "schema": "nim367.j.v1",
              "runId": "${{ github.run_id }}",
              "runAttempt": "${{ github.run_attempt }}",
              "job": "${{ github.job }}",
              "h1RecordSha256": "${{ needs.nim367-h1-verify.outputs.h1_record_sha256 }}",
              "serverJobRecord": json.loads('''$MATCH_RESULT'''),
              "selectedXcodeBuild": "$XCODE_BUILD",
              "observedCompleteTupleSha256": "$OBSERVED_COMPLETE_TUPLE_SHA256",
              "approvedCompleteTupleSha256Expected": "${{ needs.nim367-h1-verify.outputs.approved_complete_tuple_sha256 }}",
              "sharedStateManifestSha256": "$SHARED_STATE_MANIFEST_HASH",
