            -destination "$IOS_SIMULATOR_DESTINATION" \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:NimbalystNativeTests/SessionFeedContinuityTests \
            -test-iterations 20 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            -derivedDataPath "$RUNNER_TEMP/nim367/DerivedData/deterministic-stress" \
            SWIFT_VERSION=6 \
            SWIFT_STRICT_CONCURRENCY=complete \
            -resultBundlePath "$RUNNER_TEMP/nim367/stress/deterministic-20x.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/nim367/deterministic-stress.log"

      - name: Package and hash evidence
        if: always()
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/nim367-package/payload"
          mkdir -p "$PKG"
          cp "$RUNNER_TEMP/nim367-j/j-record.json" "$PKG"/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/nim367/*.log "$PKG"/ 2>/dev/null || true
          find "$RUNNER_TEMP/nim367" -name '*.xcresult' -exec cp -R {} "$PKG"/ \; 2>/dev/null || true
          (cd "$RUNNER_TEMP/nim367-package" && find payload -type f | sort | xargs -I{} shasum -a 256 {} > SHA256SUMS)
          (cd "$RUNNER_TEMP/nim367-package" && shasum -a 256 SHA256SUMS > SHA256SUMS.sha256)

      - name: Upload gate 2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed release: v4
        with:
          name: nim367-deterministic-stress-${{ inputs.repair_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nim367-package
          overwrite: false
          retention-days: 90

  nim367-production-urlsession-stress:
    name: 'NIM-367 Gate 3: production URLSession/WebSocket seeded stress'
    if: github.event_name == 'workflow_dispatch'
    needs: [nim367-attest-only, nim367-h1-verify, nim367-identity-compile-focused]
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    steps:
      - name: Setup Xcode (H1-approved build)
