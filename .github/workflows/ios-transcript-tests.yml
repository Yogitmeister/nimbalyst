    if: github.event_name == 'workflow_dispatch'
    needs: [nim367-attest-only, nim367-identity-compile-focused]
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    steps:
      - name: Verify J attestation barrier (re-observe host/tool tuple, compare to attest-only)
        run: |
          set -euo pipefail
          OBSERVED_SWIFT_HASH=$(xcrun swift --version | shasum -a 256 | cut -d' ' -f1)
          OBSERVED_SWIFTC_HASH=$(xcrun swiftc --version | shasum -a 256 | cut -d' ' -f1)
          if [ "$OBSERVED_SWIFT_HASH" != "${{ needs.nim367-attest-only.outputs.swift_version_hash }}" ] || \
             [ "$OBSERVED_SWIFTC_HASH" != "${{ needs.nim367-attest-only.outputs.swiftc_version_hash }}" ]; then
            echo "::error::this job's Swift/SwiftC tuple does not match the attest-only barrier's observation (J record mismatch)"
            exit 1
          fi
          echo "J attestation barrier: OK"

      - name: Checkout gate (sealed, workflow_sha)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # reviewed release: v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SUT (sealed, exact repair SHA)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # reviewed release: v5.0.0
        with:
          ref: ${{ inputs.repair_sha }}
          path: sut
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Xcode (approved build)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # reviewed release: v1 (v1.7.0)
        with:
          xcode-version: ${{ vars.APPROVED_XCODE_BUILD }}

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail
          SIMULATOR_UDID=$(xcrun simctl list -j devices available | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      print(device['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Gate 4b -- iOS TSan production (fixed 10 iterations)
        env:
          NIM367_STRESS_ITERATIONS: '10'
          NIM367_STRESS_SEED: ${{ inputs.production_stress_seed }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nim367"
          cd gate/packages/ios/NimbalystAppleGate
          set +e
          xcodebuild test \
            -scheme "${{ vars.APPROVED_GATE_SCHEME }}" \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:NIM367AppleGateTests/NIM367URLSessionStressTests \
            -enableThreadSanitizer YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 360 \
            -derivedDataPath "$RUNNER_TEMP/nim367/DerivedData/tsan-production-ios" \
            SWIFT_VERSION=6 \
            SWIFT_STRICT_CONCURRENCY=complete \
            -resultBundlePath "$RUNNER_TEMP/nim367/tsan/production-ios.xcresult" \
            > "$RUNNER_TEMP/nim367/tsan-production-ios.log" 2>&1
          echo "TSAN_PRODUCTION_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Classify TSan production result (disabled | allowlisted)
        run: |
          set -euo pipefail
          if [ "$TSAN_PRODUCTION_EXIT" = "0" ]; then
            echo "TSAN_PRODUCTION_VERDICT=PASS_IOS" >> "$GITHUB_ENV"
          elif [ "${{ vars.TSAN_FALLBACK_MODE }}" = "disabled" ]; then
            echo "::error::iOS TSan production failed and tsan_fallback_mode is disabled; no macOS fallback is authorized"
            echo "TSAN_PRODUCTION_VERDICT=FAIL" >> "$GITHUB_ENV"
            exit 1
          else
            echo "::warning::macOS TSan fallback requires an owner-approved allowlist entry from the protected environment; this workflow does not invent one."
            echo "TSAN_PRODUCTION_VERDICT=BLOCKED_UNKNOWN" >> "$GITHUB_ENV"
          fi

      - name: Package and hash evidence
        if: always()
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/nim367-package/payload"
          mkdir -p "$PKG"
          cp "$RUNNER_TEMP"/nim367/*.log "$PKG"/ 2>/dev/null || true
          find "$RUNNER_TEMP/nim367" -name '*.xcresult' -exec cp -R {} "$PKG"/ \; 2>/dev/null || true
          echo "{\"verdict\":\"${TSAN_PRODUCTION_VERDICT:-UNKNOWN}\"}" > "$PKG/tsan-production-classification.json"
          (cd "$RUNNER_TEMP/nim367-package" && find payload -type f | sort | xargs -I{} shasum -a 256 {} > SHA256SUMS)
          (cd "$RUNNER_TEMP/nim367-package" && shasum -a 256 SHA256SUMS > SHA256SUMS.sha256)

      - name: Upload gate 4b evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed release: v4
        with:
          name: nim367-tsan-production-${{ inputs.repair_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nim367-package
          overwrite: false
          retention-days: 90

  nim367-evidence-summary:
    name: 'NIM-367 Gate 5: final evidence collation (not Apple acceptance)'
    if: always() && github.event_name == 'workflow_dispatch'
    needs:
      - nim367-attest-only
      - nim367-identity-compile-focused
      - nim367-deterministic-stress
      - nim367-production-urlsession-stress
      - nim367-tsan-focused
      - nim367-tsan-production
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    permissions:
      contents: read
    steps:
      - name: Download all gate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # reviewed release: v4, final evidence collation only
        with:
          path: ${{ runner.temp }}/nim367-artifacts

      - name: Collate verdicts (GATE_EVIDENCE_PASS only, never APPLE_ACCEPTED)
        run: |
          python3 - <<'PYEOF'
          import json, os

          needs = {
              "identity_compile_focused": "${{ needs.nim367-identity-compile-focused.result }}",
              "deterministic_stress": "${{ needs.nim367-deterministic-stress.result }}",
              "production_urlsession_stress": "${{ needs.nim367-production-urlsession-stress.result }}",
              "tsan_focused": "${{ needs.nim367-tsan-focused.result }}",
              "tsan_production": "${{ needs.nim367-tsan-production.result }}",
          }

          all_success = all(v == "success" for v in needs.values())
          summary = {
              "schema": "nim367.gate-summary.v1",
              "repairSha": "${{ inputs.repair_sha }}",
              "runId": "${{ github.run_id }}",
              "runAttempt": "${{ github.run_attempt }}",
              "jobResults": needs,
              "verdict": "GATE_EVIDENCE_PASS" if all_success else "GATE_EVIDENCE_INCOMPLETE",
              "note": "This summary is workflow-authored evidence only. It is not APPLE_ACCEPTED and does not constitute Apple runtime acceptance -- that determination is made only by the authorized owner after independent GitHub metadata retrieval and comparison to the external approval record, per the brief's 'Independent runtime provenance' section.",
          }
          os.makedirs("${{ runner.temp }}/nim367-summary", exist_ok=True)
          with open("${{ runner.temp }}/nim367-summary/nim367-gate-summary.json", "w") as f:
              json.dump(summary, f, indent=2)
          print(json.dumps(summary, indent=2))
          PYEOF

      - name: Upload evidence summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed release: v4
        with:
          name: nim367-evidence-summary-${{ inputs.repair_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nim367-summary
          overwrite: false
          retention-days: 90
