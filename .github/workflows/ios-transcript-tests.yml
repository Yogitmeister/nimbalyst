            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            -derivedDataPath "$RUNNER_TEMP/nim367/DerivedData/deterministic-stress" \
            SWIFT_VERSION=6 \
            SWIFT_STRICT_CONCURRENCY=complete \
            -resultBundlePath "$RUNNER_TEMP/nim367/stress/deterministic-20x.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/nim367/deterministic-stress.log"

      - name: Package and hash evidence
        if: always()
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/nim367-package/payload"
          mkdir -p "$PKG"
          cp "$RUNNER_TEMP"/nim367/*.log "$PKG"/ 2>/dev/null || true
          find "$RUNNER_TEMP/nim367" -name '*.xcresult' -exec cp -R {} "$PKG"/ \; 2>/dev/null || true
          (cd "$RUNNER_TEMP/nim367-package" && find payload -type f | sort | xargs -I{} shasum -a 256 {} > SHA256SUMS)
          (cd "$RUNNER_TEMP/nim367-package" && shasum -a 256 SHA256SUMS > SHA256SUMS.sha256)

