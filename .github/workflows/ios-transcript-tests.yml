name: iOS Transcript Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/ios/**'
      - 'packages/runtime/**'
      - '.github/workflows/ios-transcript-tests.yml'
  # macOS minutes bill 10x Ubuntu minutes, so on PRs we only run the full
  # simulator job when iOS itself changes. Runtime changes are covered on
  # PRs by the cheap Ubuntu `transcript-bundle` job in ci.yml, and re-run
  # in full here on push to main.
  pull_request:
    branches: [main]
    paths:
      - 'packages/ios/**'
      - '.github/workflows/ios-transcript-tests.yml'
  workflow_dispatch:
    inputs:
      repair_sha:
        description: Exact NIM-367 repair commit; must equal the locked SHA
        required: true
        type: string
      production_stress_iterations:
        description: Seeded production URLSession/WebSocket schedules per test
        required: true
        default: '40'
        type: string
      production_stress_seed:
        description: Unsigned 32-bit decimal seed recorded in receipts
        required: true
        default: '3670421'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Make npm resilient to transient registry socket drops (ECONNRESET) on the
  # cache-miss path. On a cache hit npm ci is skipped entirely (see below).
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_fetch_timeout: '300000'

jobs:
  ios-build-and-test:
    name: iOS Build and Test
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # node_modules cache short-circuits `npm ci` when the lockfile is
      # unchanged, so the common case makes ZERO registry calls and can't hit a
      # transient network failure. Exact-key match only (no restore-keys) so we
      # never run against a partially-stale tree -- on miss we just `npm ci`.
      # Paths are relative to the repo root (github.workspace), NOT the job's
      # packages/ios working-directory, which only applies to `run:` steps.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/extensions/*/node_modules
          key: node-modules-ios-${{ runner.os }}-node22-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          cd ../..
          npm ci --ignore-scripts

      # The editor bundle (vite.config.editor.ts) aliases @nimbalyst/runtime to
      # source, and that source imports @nimbalyst/extension-sdk from its built
      # dist. `npm ci --ignore-scripts` skips that build, so build it explicitly
      # here (as ci.yml does) or the "Build Editor Web Bundle" script phase fails
      # with: Failed to resolve entry for package "@nimbalyst/extension-sdk".
      - name: Build extension-sdk
        run: |
          cd ../..
          npm run build --prefix packages/extension-sdk

      - name: Build transcript bundle
        run: npx vite build --config vite.config.transcript.ts

      - name: Verify transcript bundle exists
        run: |
          if [ ! -f "dist-transcript/transcript.html" ]; then
            echo "Error: transcript.html not found in dist-transcript/"
            exit 1
          fi
          if [ ! -d "dist-transcript/assets" ]; then
            echo "Error: assets folder not found in dist-transcript/"
            exit 1
          fi
          echo "Transcript bundle built successfully"
          du -sh dist-transcript
          du -sh dist-transcript/assets

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Copy transcript to iOS Resources
        run: |
          mkdir -p NimbalystApp/Resources/transcript-dist
          cp dist-transcript/transcript.html NimbalystApp/Resources/transcript-dist/
          cp -R dist-transcript/assets NimbalystApp/Resources/transcript-dist/

      - name: Regenerate Xcode project
        run: |
          cd NimbalystApp
          xcodegen generate

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail

          SIMULATOR_INFO=$(python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "-j", "devicetypes", "runtimes", "devices", "available"],
                  text=True,
              )
          )

          runtimes = [runtime for runtime in data["runtimes"] if runtime.get("isAvailable") and runtime.get("platform") == "iOS"]
          if not runtimes:
              raise SystemExit("No available iOS simulator runtimes found")

          def version_key(runtime):
              return tuple(int(part) for part in runtime["version"].split("."))

          runtimes.sort(key=version_key)
          runtime = runtimes[-1]

          preferred_device_types = [
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro",
          ]

          device_types = {device_type["identifier"]: device_type for device_type in data["devicetypes"]}
          device_type = next((device_types[identifier] for identifier in preferred_device_types if identifier in device_types), None)
          if device_type is None:
              iphone_device_types = sorted(
                  (device_type for device_type in data["devicetypes"] if device_type.get("productFamily") == "iPhone"),
                  key=lambda device_type: device_type["name"],
              )
              if not iphone_device_types:
                  raise SystemExit("No iPhone simulator device types found")
              device_type = iphone_device_types[0]

          existing_devices = data["devices"].get(runtime["identifier"], [])
          existing_device = next(
              (
                  device
                  for device in existing_devices
                  if device.get("isAvailable") and device.get("deviceTypeIdentifier") == device_type["identifier"]
              ),
              None,
          )

          if existing_device is not None:
              simulator_udid = existing_device["udid"]
          else:
              simulator_udid = subprocess.check_output(
                  [
                      "xcrun",
                      "simctl",
                      "create",
                      "CI iPhone Simulator",
                      device_type["identifier"],
                      runtime["identifier"],
                  ],
                  text=True,
              ).strip()

          print(f"SIMULATOR_UDID={simulator_udid}")
          print(f"SIMULATOR_NAME={device_type['name']}")
          print(f"SIMULATOR_RUNTIME={runtime['name']}")
          PY
          )

          echo "$SIMULATOR_INFO" >> "$GITHUB_ENV"

          SIMULATOR_UDID=$(printf '%s\n' "$SIMULATOR_INFO" | sed -n 's/^SIMULATOR_UDID=//p')
          SIMULATOR_NAME=$(printf '%s\n' "$SIMULATOR_INFO" | sed -n 's/^SIMULATOR_NAME=//p')
          SIMULATOR_RUNTIME=$(printf '%s\n' "$SIMULATOR_INFO" | sed -n 's/^SIMULATOR_RUNTIME=//p')

          echo "Using simulator: $SIMULATOR_NAME on $SIMULATOR_RUNTIME ($SIMULATOR_UDID)"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Build NimbalystNative package
        run: |
          cd NimbalystNative
          xcodebuild build \
            -scheme NimbalystNative \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            -skipPackagePluginValidation

      - name: Run NimbalystNative tests
        run: |
          cd NimbalystNative
          xcodebuild test \
            -scheme NimbalystNative \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            -skipPackagePluginValidation \
            -enableCodeCoverage YES

      - name: Build iOS app (simulator)
        run: |
          cd NimbalystApp
          xcodebuild \
            -project NimbalystApp.xcodeproj \
            -scheme NimbalystApp \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            -configuration Debug \
            clean build

      - name: Verify transcript bundle in app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NimbalystApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built app"
            exit 1
          fi

          if [ ! -d "$APP_PATH/transcript-dist" ]; then
            echo "Error: transcript-dist not found in app bundle at $APP_PATH"
            echo "Contents of app bundle:"
            ls -la "$APP_PATH"
            exit 1
          fi

          echo "Transcript bundle successfully included in app"
          ls -la "$APP_PATH/transcript-dist"

  # ---------------------------------------------------------------------
  # NIM-367 manual acceptance gate. Every job below runs only on an explicit
  # workflow_dispatch and reads its OWNER-FILLED IMMUTABLE identity values
  # (approved gate ref/commit/tree/blobs, approved scheme, approved Xcode
  # build, TSan fallback mode/allowlist) from the `nim367-apple-gate-approval`
  # protected GitHub Environment. Those values are populated by a separate
  # owner-authority Phase D record, never by this workflow file itself -- see
  # D:/!! CLAUDE/_pending/v12_nim367_apple_ci_gate_implementation_brief.md,
  # "Independent gate-revision trust anchor".
  #
  # Action pins below are resolved, verifiable upstream commit SHAs (recorded
  # with source in
  # D:/!! CLAUDE/_pending/v12_nim367_canonical_successor_owner_completion_20260723.md),
  # not placeholders -- this closes the action-pin gap flagged by
  # v12_nim367_canonical_successor_owner_brief_20260723.md. They still require
  # separate Phase D re-approval before any real dispatch, per "Immutable
  # action supply-chain lock" in the normative Apple contract.
  #
  # `nim367-attest-only` (below) implements the credit-contract's H0/H1/J
  # attest-only barrier structurally: it runs first, performs no checkout of
  # candidate or SUT, and publishes host/tool/runner observations as job
  # outputs. Every candidate job re-observes the same tuple on its own runner
  # and fails closed on any mismatch before its own checkout step -- this is
  # the mechanically checkable part of the "J" per-job attestation. The
  # cryptographically signed H0 pre-dispatch envelope and H1 post-attestation
  # lease described in
  # D:/!! CLAUDE/_pending/v12_nim367_hosted_macos_credit_contract_revision_20260722.md
  # remain external owner-authority records this workflow file cannot create;
  # candidate jobs' `environment: nim367-apple-gate-approval` protection rule
  # (required reviewers) is the GitHub-native approximation of the H1 barrier
  # until that owner record exists.
  #
  # This job set intentionally does not claim GATE_EVIDENCE_PASS,
  # APPLE_VERIFICATION_PASS, or APPLE_ACCEPTED anywhere -- those verdicts
  # require real Apple runtime evidence that only exists after an authorized
  # dispatch executes these steps on real hosted-macOS hardware.

  nim367-attest-only:
    name: 'NIM-367 Gate 0: attest-only barrier (no candidate/SUT checkout)'
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    permissions:
      contents: read
    outputs:
      xcode_build: ${{ steps.attest.outputs.xcode_build }}
      swift_version_hash: ${{ steps.attest.outputs.swift_version_hash }}
      swiftc_version_hash: ${{ steps.attest.outputs.swiftc_version_hash }}
      runner_os: ${{ steps.attest.outputs.runner_os }}
      attestation_manifest_sha256: ${{ steps.attest.outputs.attestation_manifest_sha256 }}
    steps:
      - name: Attest-only host/tool/server observation (no checkout)
        id: attest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nim367-attest"

          SW_VERS=$(sw_vers)
          UNAME_A=$(uname -a)
          XCODE_SELECT_P=$(xcode-select -p)
          XCODEBUILD_VERSION=$(xcodebuild -version)
          SWIFT_EXEC=$(xcrun --find swift)
          SWIFTC_EXEC=$(xcrun --find swiftc)
          SWIFT_VERSION_OUT=$("$SWIFT_EXEC" --version)
          SWIFTC_VERSION_OUT=$("$SWIFTC_EXEC" --version)
          SWIFT_VERSION_HASH=$(echo "$SWIFT_VERSION_OUT" | shasum -a 256 | cut -d' ' -f1)
          SWIFTC_VERSION_HASH=$(echo "$SWIFTC_VERSION_OUT" | shasum -a 256 | cut -d' ' -f1)

          cat > "$RUNNER_TEMP/nim367-attest/attestation.json" <<EOF
          {
            "schema": "nim367.attest-only.v1",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "job": "${{ github.job }}",
            "repository": "${{ github.repository }}",
            "workflowRef": "${{ github.workflow_ref }}",
            "workflowSha": "${{ github.workflow_sha }}",
            "headRef": "${{ github.ref }}",
            "headSha": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "runnerOs": "${{ runner.os }}",
            "runnerArch": "${{ runner.arch }}",
            "runnerName": "${{ runner.name }}",
            "xcodeSelectP": $(echo "$XCODE_SELECT_P" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
            "xcodebuildVersion": $(echo "$XCODEBUILD_VERSION" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))"),
            "swiftExecRealpath": "$SWIFT_EXEC",
            "swiftcExecRealpath": "$SWIFTC_EXEC",
            "swiftVersionHash": "$SWIFT_VERSION_HASH",
            "swiftcVersionHash": "$SWIFTC_VERSION_HASH"
          }
          EOF

          MANIFEST_HASH=$(shasum -a 256 "$RUNNER_TEMP/nim367-attest/attestation.json" | cut -d' ' -f1)
          XCODE_BUILD=$(echo "$XCODEBUILD_VERSION" | grep -o 'Build version [A-Za-z0-9]*' | sed 's/Build version //')

          echo "xcode_build=$XCODE_BUILD" >> "$GITHUB_OUTPUT"
          echo "swift_version_hash=$SWIFT_VERSION_HASH" >> "$GITHUB_OUTPUT"
          echo "swiftc_version_hash=$SWIFTC_VERSION_HASH" >> "$GITHUB_OUTPUT"
          echo "runner_os=${{ runner.os }}" >> "$GITHUB_OUTPUT"
          echo "attestation_manifest_sha256=$MANIFEST_HASH" >> "$GITHUB_OUTPUT"

          echo "::notice::This job performed no candidate or SUT checkout. Observed only pre-installed host/tool state. Full H0/H1 signed-record verification remains external owner authority (see v12_nim367_hosted_macos_credit_contract_revision_20260722.md)."

      - name: Upload attest-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed release: v4
        with:
          name: nim367-attest-only-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nim367-attest
          overwrite: false
          retention-days: 90

  nim367-identity-compile-focused:
    name: 'NIM-367 Gate 1: identity + strict compile + focused'
    if: github.event_name == 'workflow_dispatch'
    needs: nim367-attest-only
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    permissions:
      contents: read
    env:
      NIM367_REPAIR_SHA: ${{ inputs.repair_sha }}
    steps:
      - name: Verify J attestation barrier (re-observe host/tool tuple, compare to attest-only)
        run: |
          set -euo pipefail
          OBSERVED_SWIFT_HASH=$(xcrun swift --version | shasum -a 256 | cut -d' ' -f1)
          OBSERVED_SWIFTC_HASH=$(xcrun swiftc --version | shasum -a 256 | cut -d' ' -f1)
          if [ "$OBSERVED_SWIFT_HASH" != "${{ needs.nim367-attest-only.outputs.swift_version_hash }}" ] || \
             [ "$OBSERVED_SWIFTC_HASH" != "${{ needs.nim367-attest-only.outputs.swiftc_version_hash }}" ]; then
            echo "::error::this job's Swift/SwiftC tuple does not match the attest-only barrier's observation (J record mismatch)"
            exit 1
          fi
          if [ "${{ runner.os }}" != "${{ needs.nim367-attest-only.outputs.runner_os }}" ]; then
            echo "::error::this job's runner.os does not match the attest-only barrier's observation"
            exit 1
          fi
          echo "J attestation barrier: OK (matches attest-only observation ${{ needs.nim367-attest-only.outputs.attestation_manifest_sha256 }})"

      - name: Verify exact-SHA and identity-lock inputs
        run: |
          set -euo pipefail
          if [ "${{ inputs.repair_sha }}" != "cd87e6047b30da9e166d9b2350726ad1d8554009" ]; then
            echo "::error::repair_sha does not equal the locked NIM-367 repair commit"
            exit 1
          fi
          case "${{ inputs.production_stress_iterations }}" in
            2[0-9]|3[0-9]|40) ;;
            *) echo "::error::production_stress_iterations out of canonical range 20..40"; exit 1 ;;
          esac
          if [ "${{ inputs.production_stress_seed }}" -lt 0 ] 2>/dev/null || [ "${{ inputs.production_stress_seed }}" -gt 4294967295 ] 2>/dev/null; then
            echo "::error::production_stress_seed out of canonical unsigned 32-bit range"
            exit 1
          fi
          if [ -z "${{ vars.APPROVED_GATE_REF }}" ] || [ -z "${{ vars.APPROVED_GATE_COMMIT }}" ]; then
            echo "::error::protected environment nim367-apple-gate-approval is missing OWNER-FILLED IMMUTABLE values; Phase D has not populated this record"
            exit 1
          fi
          if [ "${{ github.ref }}" != "${{ vars.APPROVED_GATE_REF }}" ]; then
            echo "::error::github.ref does not equal APPROVED_GATE_REF"
            exit 1
          fi
          if [ "${{ github.workflow_ref }}" != "${{ vars.APPROVED_WORKFLOW_REF }}" ]; then
            echo "::error::github.workflow_ref does not equal APPROVED_WORKFLOW_REF"
            exit 1
          fi
          if [ "${{ github.workflow_sha }}" != "${{ vars.APPROVED_GATE_COMMIT }}" ] || [ "${{ github.sha }}" != "${{ vars.APPROVED_GATE_COMMIT }}" ]; then
            echo "::error::github.workflow_sha/github.sha does not equal APPROVED_GATE_COMMIT"
            exit 1
          fi

      - name: Checkout gate (sealed, workflow_sha)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # reviewed release: v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SUT (sealed, exact repair SHA)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # reviewed release: v5.0.0
        with:
          ref: ${{ inputs.repair_sha }}
          path: sut
          fetch-depth: 2
          persist-credentials: false

      - name: Verify sealed-checkout identity and clean status
        run: |
          set -euo pipefail
          GATE_HEAD=$(git -C gate rev-parse HEAD)
          GATE_TREE=$(git -C gate rev-parse HEAD^{tree})
          if [ "$GATE_HEAD" != "${{ vars.APPROVED_GATE_COMMIT }}" ] || [ "$GATE_TREE" != "${{ vars.APPROVED_GATE_TREE }}" ]; then
            echo "::error::gate checkout HEAD/tree does not match the approved record"
            exit 1
          fi
          SUT_HEAD=$(git -C sut rev-parse HEAD)
          SUT_PARENT=$(git -C sut rev-parse HEAD^)
          SUT_TREE=$(git -C sut rev-parse HEAD^{tree})
          if [ "$SUT_HEAD" != "cd87e6047b30da9e166d9b2350726ad1d8554009" ] || \
             [ "$SUT_PARENT" != "7ec725a456c230751c70a3d7269fc89fd6ce55ca" ] || \
             [ "$SUT_TREE" != "f9767e7febafee27347b55ab9a6eee6595d4dbe4" ]; then
            echo "::error::SUT checkout HEAD/parent/tree does not match the locked repair identity"
            exit 1
          fi
          DIFF_PATHS=$(git -C sut diff-tree --no-commit-id --name-status -r HEAD | sort)
          EXPECTED_PATHS=$(printf 'M\tpackages/ios/NimbalystNative/Sources/Sync/DocumentSyncManager.swift\nM\tpackages/ios/NimbalystNative/Sources/Sync/SyncManager.swift\nM\tpackages/ios/NimbalystNative/Sources/Sync/WebSocketClient.swift\nM\tpackages/ios/NimbalystNative/Tests/SessionFeedContinuityTests.swift\n' | sort)
          if [ "$DIFF_PATHS" != "$EXPECTED_PATHS" ]; then
            echo "::error::SUT diff-tree does not equal exactly the four recorded repair paths"
            exit 1
          fi
          for repo in gate sut; do
            git -C "$repo" status --porcelain=v1 --untracked-files=all > "$repo-status-untracked.txt"
            git -C "$repo" status --ignored=matching --porcelain=v1 > "$repo-status-ignored.txt"
            if [ -s "$repo-status-untracked.txt" ] || [ -s "$repo-status-ignored.txt" ]; then
              echo "::error::$repo checkout is not clean (untracked or ignored-matching entries present)"
              exit 1
            fi
          done

      - name: Setup Xcode (approved build)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # reviewed release: v1 (v1.7.0)
        with:
          xcode-version: ${{ vars.APPROVED_XCODE_BUILD }}

      - name: Materialize watchdog wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/nim367"
          cat > "$RUNNER_TEMP/nim367/watchdog.py" <<'PYEOF'
          import argparse, json, os, signal, subprocess, sys, time

          def main():
              p = argparse.ArgumentParser()
              p.add_argument("--timeout-seconds", type=int, required=True)
              p.add_argument("--term-grace-seconds", type=int, default=15)
              p.add_argument("--stdout", required=True)
              p.add_argument("--stderr", required=True)
              p.add_argument("--combined-log", required=True)
              p.add_argument("--status", required=True)
              p.add_argument("cmd", nargs=argparse.REMAINDER)
              args = p.parse_args()
              cmd = args.cmd[1:] if args.cmd and args.cmd[0] == "--" else args.cmd

              start = time.time()
              start_utc = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              with open(args.stdout, "wb") as out_f, open(args.stderr, "wb") as err_f:
                  proc = subprocess.Popen(cmd, stdout=out_f, stderr=err_f, start_new_session=True)
                  timed_out = False
                  try:
                      proc.wait(timeout=args.timeout_seconds)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      os.killpg(os.getpgid(proc.pid), signal.SIGTERM)
                      try:
                          proc.wait(timeout=args.term_grace_seconds)
                      except subprocess.TimeoutExpired:
                          os.killpg(os.getpgid(proc.pid), signal.SIGKILL)
                          proc.wait()
              end = time.time()
              end_utc = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              exit_code = 124 if timed_out else proc.returncode

              with open(args.stdout, "rb") as out_f, open(args.stderr, "rb") as err_f, open(args.combined_log, "wb") as combined:
                  combined.write(b"--- stdout ---\n")
                  combined.write(out_f.read())
                  combined.write(b"--- stderr ---\n")
                  combined.write(err_f.read())

              status = {
                  "startUtc": start_utc,
                  "endUtc": end_utc,
                  "elapsedSeconds": end - start,
                  "pid": proc.pid,
                  "command": cmd,
                  "exitCode": exit_code,
                  "timedOut": timed_out,
              }
              with open(args.status, "w") as status_f:
                  json.dump(status, status_f)

              sys.exit(exit_code)

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Mechanical dependency-equivalence gate
        run: |
          python3 - <<'PYEOF'
          import json, sys

          def load(path):
              with open(path) as f:
                  return json.load(f)

          sut_pins = load("sut/packages/ios/NimbalystNative/Package.resolved")["pins"]
          gate_pins = load("gate/packages/ios/NimbalystAppleGate/Package.resolved")["pins"]

          def canon(pins):
              out = []
              for pin in pins:
                  state = pin["state"]
                  out.append((pin["identity"], pin["kind"], pin["location"], state.get("revision"), state.get("version")))
              return sorted(out)

          required = {
              "grdb.swift": "aa0079aeb82a4bf00324561a40bffe68c6fe1c26",
              "posthog-ios": "1ba3e8636d4f1ad9f18f5a4273e88d39a162466b",
          }
          gate_by_id = {pin["identity"]: pin for pin in gate_pins}
          for identity, revision in required.items():
              if identity not in gate_by_id:
                  print(f"::error::missing required dependency {identity}", file=sys.stderr)
                  sys.exit(1)
              if gate_by_id[identity]["state"].get("revision") != revision:
                  print(f"::error::{identity} revision does not equal the locked immutable revision", file=sys.stderr)
                  sys.exit(1)
          if len(gate_pins) != len(required):
              print("::error::gate Package.resolved declares an unapproved additional dependency", file=sys.stderr)
              sys.exit(1)
          print("Mechanical dependency-equivalence gate: OK")
          PYEOF

      - name: Gate 1 -- scheme preflight, strict compile, focused execution
        env:
          RESOLVER_ROOT: ${{ runner.temp }}/nim367/resolver
        run: |
          set -euo pipefail
          mkdir -p "$RESOLVER_ROOT"/{cache,configuration,security,scratch,clones,receipts}
          SWIFT_EXEC=$(xcrun --find swift)
          SWIFTC_EXEC=$(xcrun --find swiftc)
          echo "SWIFT_EXEC=$SWIFT_EXEC" >> "$GITHUB_ENV"
          echo "SWIFTC_EXEC=$SWIFTC_EXEC" >> "$GITHUB_ENV"
          "$SWIFT_EXEC" --version
          "$SWIFTC_EXEC" --version
          xcode-select -p
          xcodebuild -version

          cd gate/packages/ios/NimbalystAppleGate
          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 300 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/dump-package.stdout" \
            --stderr "$RUNNER_TEMP/nim367/dump-package.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/dump-package.log" \
            --status "$RUNNER_TEMP/nim367/dump-package.watchdog.json" \
            -- "$SWIFT_EXEC" package \
              --package-path "$GITHUB_WORKSPACE/gate/packages/ios/NimbalystAppleGate" \
              --cache-path "$RESOLVER_ROOT/cache" \
              --config-path "$RESOLVER_ROOT/configuration" \
              --security-path "$RESOLVER_ROOT/security" \
              --scratch-path "$RESOLVER_ROOT/scratch" \
              dump-package

          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 120 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/scheme-list.stdout" \
            --stderr "$RUNNER_TEMP/nim367/scheme-list.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/scheme-list.log" \
            --status "$RUNNER_TEMP/nim367/scheme-list.watchdog.json" \
            -- xcodebuild -list -json \
              -disableAutomaticPackageResolution \
              -onlyUsePackageVersionsFromResolvedFile \
              -clonedSourcePackagesDirPath "$RESOLVER_ROOT/clones"

          if ! grep -q "${{ vars.APPROVED_GATE_SCHEME }}" "$RUNNER_TEMP/nim367/scheme-list.stdout"; then
            echo "::error::approved test-bearing scheme not present in observed scheme list"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/sut/packages/ios/NimbalystNative"
          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 900 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/swift-focused.stdout" \
            --stderr "$RUNNER_TEMP/nim367/swift-focused.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/swift-focused.log" \
            --status "$RUNNER_TEMP/nim367/swift-focused.watchdog.json" \
            -- "$SWIFT_EXEC" test \
              --package-path "$GITHUB_WORKSPACE/sut/packages/ios/NimbalystNative" \
              --cache-path "$RESOLVER_ROOT/cache" \
              --config-path "$RESOLVER_ROOT/configuration" \
              --security-path "$RESOLVER_ROOT/security" \
              --disable-automatic-resolution \
              --scratch-path "$RESOLVER_ROOT/scratch" \
              --filter SessionFeedContinuityTests \
              -Xswiftc -swift-version -Xswiftc 6 \
              -Xswiftc -strict-concurrency=complete

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail
          SIMULATOR_UDID=$(xcrun simctl list -j devices available | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      print(device['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Gate 1 -- strict build and focused xctest
        env:
          RESOLVER_ROOT: ${{ runner.temp }}/nim367/resolver
        run: |
          set -euo pipefail
          cd sut/packages/ios/NimbalystNative
          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 900 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/strict-build.stdout" \
            --stderr "$RUNNER_TEMP/nim367/strict-build.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/strict-build.log" \
            --status "$RUNNER_TEMP/nim367/strict-build.watchdog.json" \
            -- xcodebuild build \
              -scheme NimbalystNative \
              -destination "$IOS_SIMULATOR_DESTINATION" \
              -skipPackagePluginValidation \
              -disableAutomaticPackageResolution \
              -onlyUsePackageVersionsFromResolvedFile \
              -clonedSourcePackagesDirPath "$RESOLVER_ROOT/clones" \
              -derivedDataPath "$RUNNER_TEMP/nim367/DerivedData/strict-build" \
              SWIFT_VERSION=6 \
              SWIFT_STRICT_CONCURRENCY=complete \
              -resultBundlePath "$RUNNER_TEMP/nim367/compile/strict-build.xcresult"

          python3 "$RUNNER_TEMP/nim367/watchdog.py" \
            --timeout-seconds 900 --term-grace-seconds 15 \
            --stdout "$RUNNER_TEMP/nim367/focused.stdout" \
            --stderr "$RUNNER_TEMP/nim367/focused.stderr" \
            --combined-log "$RUNNER_TEMP/nim367/focused.log" \
            --status "$RUNNER_TEMP/nim367/focused.watchdog.json" \
            -- xcodebuild test \
              -scheme NimbalystNative \
              -destination "$IOS_SIMULATOR_DESTINATION" \
              -skipPackagePluginValidation \
              -disableAutomaticPackageResolution \
              -onlyUsePackageVersionsFromResolvedFile \
              -clonedSourcePackagesDirPath "$RESOLVER_ROOT/clones" \
              -only-testing:NimbalystNativeTests/SessionFeedContinuityTests \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 30 \
              -maximum-test-execution-time-allowance 60 \
              -derivedDataPath "$RUNNER_TEMP/nim367/DerivedData/focused" \
              SWIFT_VERSION=6 \
              SWIFT_STRICT_CONCURRENCY=complete \
              -resultBundlePath "$RUNNER_TEMP/nim367/focused/focused-tests.xcresult"

      - name: Credential and retained-text scan
        if: always()
        run: |
          python3 - <<'PYEOF'
          import re, sys, pathlib

          SYNTHETIC_TOKEN = "nim367-loopback-public-token-v1"
          PATTERNS = [
              re.compile(r"[Bb]earer\s+[A-Za-z0-9\-._~+/]+=*"),
              re.compile(r"[Aa]uthorization:\s*[Bb]asic\s+[A-Za-z0-9+/=]+"),
              re.compile(r"eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+"),
              re.compile(r"[?&](token|jwt|auth|key|secret)=([^&\s]+)"),
          ]

          root = pathlib.Path("${{ runner.temp }}/nim367")
          findings = []
          for path in root.glob("*.log"):
              text = path.read_text(errors="replace")
              for pattern in PATTERNS:
                  for match in pattern.finditer(text):
                      value = match.group(0)
                      if SYNTHETIC_TOKEN in value:
                          continue
                      findings.append((str(path), pattern.pattern))
          if findings:
              print("::error::retained-text scan found unexpected credential-shaped content")
              for path, pattern in findings:
                  print(f"  {path}: {pattern}")
              sys.exit(1)
          print("Credential and retained-text scan: OK (no unexpected matches)")
          PYEOF

      - name: Package and hash evidence
        if: always()
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/nim367-package/payload"
          mkdir -p "$PKG"
          cp "$RUNNER_TEMP"/nim367/*.log "$PKG"/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/nim367/*.watchdog.json "$PKG"/ 2>/dev/null || true
          find "$RUNNER_TEMP/nim367" -name '*.xcresult' -exec cp -R {} "$PKG"/ \; 2>/dev/null || true
          (cd "$RUNNER_TEMP/nim367-package" && find payload -type f | sort | xargs -I{} shasum -a 256 {} > SHA256SUMS)
          (cd "$RUNNER_TEMP/nim367-package" && shasum -a 256 SHA256SUMS > SHA256SUMS.sha256)

      - name: Upload gate 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed release: v4
        with:
          name: nim367-compile-focused-${{ inputs.repair_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nim367-package
          overwrite: false
          retention-days: 90

  nim367-deterministic-stress:
    name: 'NIM-367 Gate 2: deterministic 20x stress'
    if: github.event_name == 'workflow_dispatch'
    needs: [nim367-attest-only, nim367-identity-compile-focused]
    runs-on: macos-15
    environment: nim367-apple-gate-approval
    steps:
      - name: Verify J attestation barrier (re-observe host/tool tuple, compare to attest-only)
        run: |
